# Loaded by compose-vps.sh only when the complete approved runtime identity is
# supplied. External workload services must project the same six labels; the
# exact runtime fingerprint rejects any service without them.
x-platform-runtime-labels: &platform_runtime_labels
  com.platform.runtime.candidate-id: ${PLATFORM_RUNTIME_CANDIDATE_ID:?Set the approved candidate ID}
  com.platform.runtime.commit: ${PLATFORM_RUNTIME_COMMIT:?Set the approved candidate commit}
  com.platform.runtime.tree: ${PLATFORM_RUNTIME_TREE:?Set the approved candidate tree}
  com.platform.runtime.deployment-id: ${PLATFORM_RUNTIME_DEPLOYMENT_ID:?Set the approved deployment ID}
  com.platform.runtime.source-render-sha256: ${PLATFORM_RUNTIME_SOURCE_RENDER_SHA256:?Set the exact source Compose render SHA256}
  com.platform.runtime.workload-lock-sha256: ${PLATFORM_RUNTIME_WORKLOAD_LOCK_SHA256:?Set the approved workload lock SHA256}

services:
  alertmanager:
    labels: *platform_runtime_labels
  backup-scheduler:
    labels: *platform_runtime_labels
  broker-auth-bootstrap:
    labels: *platform_runtime_labels
  cadvisor:
    labels: *platform_runtime_labels
  control-center:
