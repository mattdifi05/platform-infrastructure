services:
  postgres:
    environment: !override
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - postgres_superuser_password
      - keycloak_db_password

  redis:
    environment: !override
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    command:
      - sh
      - -ec
      - |
        REDIS_PASSWORD="$$(cat "$${REDIS_PASSWORD_FILE}")"
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat \"$${REDIS_PASSWORD_FILE}\")\" redis-cli ping | grep PONG"]
    secrets:
      - redis_password

  keycloak:
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat "$${KC_BOOTSTRAP_ADMIN_PASSWORD_FILE}")"; export KC_DB_PASSWORD="$$(cat "$${KC_DB_PASSWORD_FILE}")"; exec /opt/keycloak/bin/kc.sh start --http-port=8080 --import-realm
    environment: !override
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_EVENTS: login,logout,user_disabled_by_temporary_lockout,user_disabled_by_permanent_lockout,update_credential,remove_credential
      KC_EVENT_METRICS_USER_TAGS: realm,clientId
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.localhost.com}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-true}
    secrets:
      - keycloak_admin_password
      - keycloak_db_password

  nats:
    entrypoint:
      - /bin/sh
      - -ec
      - |
        NATS_PASSWORD="$$(cat "$${NATS_PASSWORD_FILE}")"
        exec nats-server -c /etc/nats/nats-server.conf --user "$$NATS_USER" --pass "$$NATS_PASSWORD"
    environment: !override
      NATS_USER: ${NATS_USER:-enterprise}
      NATS_PASSWORD_FILE: /run/secrets/nats_password
    secrets:
      - nats_password

  minio:
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - export MINIO_ROOT_PASSWORD="$$(cat "$${MINIO_ROOT_PASSWORD_FILE}")"; exec minio server /data --address ":9000" --console-address ":9001"
    environment: !override
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://minio.localhost.com}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
    secrets:
      - minio_root_password

  mariadb:
    environment: !override
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p\"$$(cat /run/secrets/mariadb_root_password)\" -N -e 'select 1' >/dev/null"]
    secrets:
      - mariadb_root_password

  phpmyadmin:
    environment:
      PMA_CONTROL_PASSWORD_FILE: /run/secrets/phpmyadmin_control_password
    secrets:
      - phpmyadmin_control_password

  php-apache:
    environment:
      PROJECTS_GATEWAY_EMAIL: ${PROJECTS_GATEWAY_EMAIL:-admin@example.com}
      PROJECTS_GATEWAY_SIGNING_KEYS_FILE: /run/secrets/projects_gateway_signing_keys
      MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
      MAILER_REPLY_TO: ${MAILER_REPLY_TO:?Set MAILER_REPLY_TO}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - projects_gateway_signing_keys
      - smtp_password

  alertmanager:
    secrets:
      - alertmanager_webhook_token

  platform-alert-dispatcher:
    environment:
      ALERTMANAGER_WEBHOOK_TOKEN_FILE: /run/secrets/alertmanager_webhook_token
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - alertmanager_webhook_token
      - smtp_password

  grafana:
    environment: !override
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.localhost.com}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
    secrets:
      - grafana_admin_password

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password.txt
  keycloak_db_password:
    file: ./secrets/keycloak_db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  nats_password:
    file: ./secrets/nats_password.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt
  phpmyadmin_control_password:
    file: ./secrets/phpmyadmin_control_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  control_center_vault_keys:
    file: ${CONTROL_CENTER_VAULT_KEYS_SECRET_FILE:-./secrets/control_center_vault_keys.txt}
  projects_gateway_signing_keys:
    file: ./secrets/projects_gateway_signing_keys.txt
  backup_signing_keys:
    file: ./secrets/backup_signing_keys.txt
  alertmanager_webhook_token:
    file: ./secrets/alertmanager_webhook_token.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
