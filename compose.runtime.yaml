# Tracked host-runtime overlay. This file replaces the former ignored
# host runtime and worker hotfix overlays.
x-dedicated-php-app: &dedicated_php_app
  image: ${PHP_APACHE_BUILD_IMAGE:-platform/php-apache:local}
  init: true
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  expose:
    - "80"
    - "443"
  environment: &dedicated_php_env
    PROJECTS_GATEWAY_EMAIL: ${PROJECTS_GATEWAY_EMAIL:-admin@example.com}
    PROJECTS_GATEWAY_SIGNING_KEYS_FILE: /run/secrets/projects_gateway_signing_keys
    MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
    MAILER_REPLY_TO: ${MAILER_REPLY_TO:?Set MAILER_REPLY_TO}
    SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_SECURE: ${SMTP_SECURE:-true}
    SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
    SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    NODE_PROJECT_HOSTS: ${NODE_PROJECT_HOSTS:-}
    PROJECT_STATE_FILE: /var/www/project-state/projects.json
  secrets:
    - projects_gateway_signing_keys
    - smtp_password
  depends_on:
    mariadb:
      condition: service_healthy
  networks:
    - enterprise_net
  healthcheck:
    test: ["CMD-SHELL", "apache2ctl -t >/dev/null"]
    interval: 20s
    timeout: 5s
    retries: 10

x-dedicated-node-app: &dedicated_node_app
  image: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
  init: true
  pids_limit: 768
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  working_dir: /workspace
  command: ["sh", "/usr/local/bin/node-project-runtime"]
  expose:
    - "3000"
  environment: &dedicated_node_env
    PORT: "3000"
    HOST: "0.0.0.0"
    HOSTNAME: "0.0.0.0"
    NODE_ENV: production
    CI: "true"
    PROJECT_HOST_SUFFIX: ${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
    NEXT_TELEMETRY_DISABLED: "1"
    NODE_PROJECT_LOCK_NAME: stexor-web
    NODE_PROJECT_INSTALL_COMMAND: npm exec --yes pnpm@11.9.0 -- install --frozen-lockfile
    NODE_PROJECT_BUILD_COMMAND: npm exec --yes pnpm@11.9.0 -- --filter ./apps/web build
    NODE_PROJECT_START_COMMAND: NODE_ENV=production HOSTNAME=0.0.0.0 PORT=$$PORT exec node apps/web/.next/standalone/apps/web/server.js
  volumes:
    - ${PHP_PROJECTS_DIR:-../src}/stexor:/workspace
    - ./scripts/node-project-runtime.sh:/usr/local/bin/node-project-runtime:ro
  networks:
    - enterprise_net
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
    interval: 20s
    timeout: 5s
    retries: 20
    start_period: 180s

services:
  local-registry:
    image: ${REGISTRY_IMAGE:-registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33}
    container_name: enterprise-local-registry
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - enterprise_local_registry_data:/var/lib/registry

  traefik:
    volumes:
      - ./traefik/dynamic/admin-routes.yml:/etc/traefik/dynamic/admin-routes.yml:ro
      - ./traefik/dynamic/project-routes.yml:/etc/traefik/dynamic/project-routes.yml:ro

  worker-jobs:
    command: ["node", "apps/worker-jobs/src/server.ts"]
    read_only: false
  worker-notifications:
    command: ["node", "apps/worker-notifications/src/server.ts"]
    read_only: false

  phpmyadmin:
    profiles: !reset []
    restart: unless-stopped

  phppgadmin:
    profiles: !reset []
    restart: unless-stopped

  local-dns:
    profiles: !reset []
    ports:
      - "${LOCAL_DNS_BIND:-192.168.1.164}:53:53/udp"
      - "${LOCAL_DNS_BIND:-192.168.1.164}:53:53/tcp"

  php-apache:
    profiles:
      - legacy-shared-runtime-disabled
    restart: "no"

  control-center:
    environment:
      CONTROL_CENTER_DISCOVER_HOSTED_PROJECTS: "true"

  project-router:
    environment:
      PROJECT_UPSTREAMS: ${PROJECT_UPSTREAMS:-}
      PHP_PROJECT_UPSTREAMS: >-
        anniversary=http://php-anniversary:80,
        fiplatform=http://php-fiplatform:80,
        fireport=http://php-fiplatform:80,
        matthewdifilippo=http://php-matthewdifilippo:80,
        stream=http://php-stream:80,
        workcalendar=http://php-workcalendar:80
      NODE_PROJECT_UPSTREAMS: >-
        account=http://node-account:3000,
        ui=http://node-ui:3000
      STATIC_PROJECT_UPSTREAMS: ${STATIC_PROJECT_UPSTREAMS:-}
    depends_on: !override
      php-anniversary:
        condition: service_healthy
      php-fiplatform:
        condition: service_healthy
      php-matthewdifilippo:
        condition: service_healthy
      php-stream:
        condition: service_healthy
      php-workcalendar:
        condition: service_healthy
      node-account:
        condition: service_healthy
      node-ui:
        condition: service_healthy
      control-center:
        condition: service_healthy

  node-account:
    <<: *dedicated_node_app
    container_name: node-account
    environment:
      <<: *dedicated_node_env
      ACCOUNT_HOST: account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      ACCOUNT_PUBLIC_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXTAUTH_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_ACCOUNT_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_API_URL: https://api${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_HOST: ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_PUBLIC_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_UI_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}

  node-ui:
    <<: *dedicated_node_app
    container_name: node-ui
    environment:
      <<: *dedicated_node_env
      ACCOUNT_HOST: account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      ACCOUNT_PUBLIC_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXTAUTH_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_ACCOUNT_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_API_URL: https://api${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_HOST: ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_PUBLIC_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_UI_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}

  php-anniversary:
    <<: *dedicated_php_app
    container_name: php-anniversary
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/anniversary:/var/www/projects/anniversary
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./projects-portal/state:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ./traefik/certs:/etc/apache2/certs:ro

  php-fiplatform:
    <<: *dedicated_php_app
    container_name: php-fiplatform
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/fiplatform:/var/www/projects/fiplatform
      - ${PHP_PROJECTS_DIR:-../src}/fiplatform:/var/www/projects/fireport
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./projects-portal/state:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ./traefik/certs:/etc/apache2/certs:ro

  php-matthewdifilippo:
    <<: *dedicated_php_app
    container_name: php-matthewdifilippo
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/matthewdifilippo:/var/www/projects/matthewdifilippo
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./projects-portal/state:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ./traefik/certs:/etc/apache2/certs:ro

  php-stream:
    <<: *dedicated_php_app
    container_name: php-stream
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/stream:/var/www/projects/stream
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./projects-portal/state:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ./traefik/certs:/etc/apache2/certs:ro

  php-workcalendar:
    <<: *dedicated_php_app
    container_name: php-workcalendar
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/workcalendar:/var/www/projects/workcalendar
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./projects-portal/state:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ./traefik/certs:/etc/apache2/certs:ro

volumes:
  enterprise_local_registry_data:
    name: enterprise_local_registry_data
