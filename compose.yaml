name: ${COMPOSE_PROJECT_NAME:-platform_infra}

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.5@sha256:e4d98158c01ad752fc1071d4e9573788747230d902cdde00a772516e692d07c9}
    container_name: enterprise-traefik
    init: true
    pids_limit: 256
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic/middlewares.yml:/etc/traefik/dynamic/middlewares.yml:ro
      - ./traefik/dynamic/tls-local.yml:/etc/traefik/dynamic/tls-local.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    configs:
      - source: enterprise_traefik_routes
        target: /etc/traefik/dynamic/routes.yml
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa}
    entrypoint:
      - /usr/local/bin/platform-postgres-entrypoint
    container_name: enterprise-postgres
    init: true
    pids_limit: 1024
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
    volumes:
      - enterprise_postgres_data:/var/lib/postgresql
      - ./postgres/init:/platform-postgres-init:ro
      - ./postgres/entrypoint-with-init-secrets.sh:/usr/local/bin/platform-postgres-entrypoint:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:8.6-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763}
    container_name: enterprise-redis
    init: true
    pids_limit: 256
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    command:
      - sh
      - -ec
      - |
        REDIS_PASSWORD="$$(cat "$${REDIS_PASSWORD_FILE}")"
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - enterprise_redis_data:/data
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat \"$${REDIS_PASSWORD_FILE}\")\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6.3@sha256:5fdbf2dbb5897cc34e82de49d13e23db011f9925089dbc555fc095f2c8bc1dac}
    container_name: enterprise-keycloak
    init: true
    pids_limit: 1024
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat "$${KC_BOOTSTRAP_ADMIN_PASSWORD_FILE}")"; export KC_DB_PASSWORD="$$(cat "$${KC_DB_PASSWORD_FILE}")"; exec /opt/keycloak/bin/kc.sh start --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_EVENTS: login,logout,user_disabled_by_temporary_lockout,user_disabled_by_permanent_lockout,update_credential,remove_credential
      KC_EVENT_METRICS_USER_TAGS: realm,clientId
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-keycloak.local}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - enterprise_keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    networks:
      - enterprise_net
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'true < /dev/tcp/127.0.0.1/8080'"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s

  nats:
    image: ${NATS_IMAGE:-nats:2.14-alpine@sha256:952d157e28d5394a211229bd57a7b37ff9f184e58e2c8486a08fa909fd254e32}
    container_name: enterprise-nats
    init: true
    pids_limit: 256
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - NATS_PASSWORD="$$(cat "$$NATS_PASSWORD_FILE")"; exec nats-server -c /etc/nats/nats-server.conf --user "$$NATS_USER" --pass "$$NATS_PASSWORD"
    environment:
      NATS_USER: ${NATS_USER:-enterprise}
      NATS_PASSWORD_FILE: /run/secrets/nats_password
    volumes:
      - enterprise_nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    container_name: enterprise-minio
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - export MINIO_ROOT_PASSWORD="$$(cat "$${MINIO_ROOT_PASSWORD_FILE}")"; exec minio server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://minio:9001}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://minio:9000}
    volumes:
      - enterprise_minio_data:/data
    networks:
      - enterprise_net
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  php-apache:
    image: ${PHP_APACHE_BUILD_IMAGE:-platform/php-apache:local}
    build:
      context: .
      dockerfile: docker/php-apache.Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.5-apache@sha256:c6e17deefe4b7f79fd6a826a3d5f61f28035c3a7c12a1b446bf45f0e07bee9b2}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2.10.1@sha256:7725eb4545c438629ae8bde3ef0bb9a5038ef566126ad878442a69007242d267}
        PHP_EXTENSION_INSTALLER_IMAGE: ${PHP_EXTENSION_INSTALLER_IMAGE:-mlocati/php-extension-installer:2.11.12@sha256:b6d3fa381b9ba5cf051117c1c601d6a523b590e534bf3d56eb4fbe352949c138}
    container_name: php-apache
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    expose:
      - "80"
      - "443"
    environment:
      PROJECTS_GATEWAY_EMAIL: ${PROJECTS_GATEWAY_EMAIL:-admin@example.com}
      PROJECTS_GATEWAY_SIGNING_KEYS_FILE: /run/secrets/projects_gateway_signing_keys
      MAILER_FROM: ${MAILER_FROM:-no-reply@localhost}
      MAILER_REPLY_TO: ${MAILER_REPLY_TO:-no-reply@localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      NODE_PROJECT_HOSTS: ${NODE_PROJECT_HOSTS:-}
      PROJECT_STATE_FILE: /var/www/project-state/projects.json
    secrets:
      - projects_gateway_signing_keys
      - smtp_password
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./projects-portal/state:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available
      - ./traefik/certs:/etc/apache2/certs:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "apache2ctl -t >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10

  control-center:
    image: ${CONTROL_CENTER_IMAGE:-platform/control-center:local}
    build:
      context: .
      dockerfile: docker/control-center.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
    container_name: enterprise-control-center
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    working_dir: /app
    command:
      - node
      - /app/server.mjs
    expose:
      - "8080"
    environment:
      CONTROL_CENTER_PORT: 8080
      CONTROL_CENTER_ENV: ${CONTROL_CENTER_ENV:-local}
      CONTROL_CENTER_BIND_HOST: 0.0.0.0
      CONTROL_CENTER_AUTH_MODE: ${CONTROL_CENTER_AUTH_MODE:-oidc-passkey}
      CONTROL_CENTER_AUTH_STORE: postgres
      CONTROL_CENTER_AUTH_DATABASE_URL_FILE: /run/secrets/control_center_database_url
      CONTROL_CENTER_OIDC_ISSUER: ${CONTROL_CENTER_OIDC_ISSUER:-https://${AUTH_HOST:-auth.${DOMAIN:-localhost.com}}/realms/platform}
      CONTROL_CENTER_OIDC_AUTHORIZATION_ENDPOINT: ${CONTROL_CENTER_OIDC_AUTHORIZATION_ENDPOINT:-https://${AUTH_HOST:-auth.${DOMAIN:-localhost.com}}/realms/platform/protocol/openid-connect/auth}
      CONTROL_CENTER_OIDC_TOKEN_ENDPOINT: ${CONTROL_CENTER_OIDC_TOKEN_ENDPOINT:-http://keycloak:8080/realms/platform/protocol/openid-connect/token}
      CONTROL_CENTER_OIDC_JWKS_URI: ${CONTROL_CENTER_OIDC_JWKS_URI:-http://keycloak:8080/realms/platform/protocol/openid-connect/certs}
      CONTROL_CENTER_OIDC_REDIRECT_URI: ${CONTROL_CENTER_OIDC_REDIRECT_URI:-https://${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}}/auth/callback}
      CONTROL_CENTER_PUBLIC_ORIGIN: ${CONTROL_CENTER_PUBLIC_ORIGIN:-https://${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}}}
      CONTROL_CENTER_OIDC_CLIENT_ID: ${CONTROL_CENTER_OIDC_CLIENT_ID:-platform-control-center}
      CONTROL_CENTER_OIDC_REQUIRED_ACR: ${CONTROL_CENTER_OIDC_REQUIRED_ACR:-urn:platform:loa:passkey}
      CONTROL_CENTER_OIDC_REQUIRED_AMR: ${CONTROL_CENTER_OIDC_REQUIRED_AMR:-webauthn}
      CONTROL_CENTER_OIDC_OWNER_ROLE: ${CONTROL_CENTER_OIDC_OWNER_ROLE:-owner}
      CONTROL_CENTER_OIDC_ADMIN_ROLE: ${CONTROL_CENTER_OIDC_ADMIN_ROLE:-admin}
      CONTROL_CENTER_OIDC_VIEWER_ROLE: ${CONTROL_CENTER_OIDC_VIEWER_ROLE:-viewer}
      CONTROL_CENTER_SESSION_MAX_AGE_SECONDS: ${CONTROL_CENTER_SESSION_MAX_AGE_SECONDS:-28800}
      CONTROL_CENTER_SESSION_IDLE_SECONDS: ${CONTROL_CENTER_SESSION_IDLE_SECONDS:-1800}
      CONTROL_CENTER_SESSION_POLICY_VERSION: ${CONTROL_CENTER_SESSION_POLICY_VERSION:-1}
      CONTROL_CENTER_FRESH_AUTH_SECONDS: ${CONTROL_CENTER_FRESH_AUTH_SECONDS:-300}
      CONTROL_CENTER_LOGIN_MAX_ATTEMPTS: ${CONTROL_CENTER_LOGIN_MAX_ATTEMPTS:-20}
      CONTROL_CENTER_LOGIN_WINDOW_SECONDS: ${CONTROL_CENTER_LOGIN_WINDOW_SECONDS:-60}
      CONTROL_CENTER_LOGIN_LOCK_SECONDS: ${CONTROL_CENTER_LOGIN_LOCK_SECONDS:-60}
      CONTROL_CENTER_DISCOVER_HOSTED_PROJECTS: ${CONTROL_CENTER_DISCOVER_HOSTED_PROJECTS:-false}
      CONTROL_CENTER_PHPPGADMIN_INTERNAL_URL: ${CONTROL_CENTER_PHPPGADMIN_INTERNAL_URL:-http://phppgadmin:80}
      CONTROL_CENTER_DATABASE_LIVE_APPLY: ${CONTROL_CENTER_DATABASE_LIVE_APPLY:-false}
      CONTROL_CENTER_MARIADB_HOST: ${CONTROL_CENTER_MARIADB_HOST:-mariadb}
      CONTROL_CENTER_MARIADB_PORT: ${CONTROL_CENTER_MARIADB_PORT:-3306}
      CONTROL_CENTER_MARIADB_ROOT_USER: ${CONTROL_CENTER_MARIADB_ROOT_USER:-root}
      CONTROL_CENTER_MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      CONTROL_CENTER_POSTGRES_HOST: ${CONTROL_CENTER_POSTGRES_HOST:-postgres}
      CONTROL_CENTER_POSTGRES_PORT: ${CONTROL_CENTER_POSTGRES_PORT:-5432}
      CONTROL_CENTER_POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      CONTROL_CENTER_POSTGRES_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      CONTROL_CENTER_DOCS_ROOT: /var/www/infra-docs
      PROJECTS_ROOT: /var/www/projects
      PROJECT_STATE_FILE: /var/www/project-state/projects.json
      PROJECT_AUDIT_FILE: /var/www/project-state/audit.jsonl
      PROJECT_OPERATIONS_FILE: /var/www/project-state/operations.jsonl
      PROJECT_APPLICATIONS_FILE: /var/www/project-state/applications.json
      PROJECT_DOMAINS_FILE: /var/www/project-state/domains.json
      PROJECT_DATABASES_FILE: /var/www/project-state/databases.json
      PROJECT_DATABASE_PRINCIPALS_FILE: /var/www/project-state/database-principals.json
      PROJECT_DATABASE_DESTRUCTIVE_OPERATIONS_FILE: /var/www/project-state/database-destructive-operations.json
      CONTROL_CENTER_REPORTS_ROOT: /var/www/infra-docs/reports
      CONTROL_CENTER_DATABASE_DELETE_EVIDENCE_MAX_AGE_SECONDS: ${CONTROL_CENTER_DATABASE_DELETE_EVIDENCE_MAX_AGE_SECONDS:-86400}
      PROJECT_STORAGE_BUCKETS_FILE: /var/www/project-state/storage-buckets.json
      PROJECT_SENSITIVE_MATERIALS_FILE: /var/www/project-state/sensitive-materials.json
      PROJECT_VAULT_FILE: /var/www/project-state/secret-vault.json
      CONTROL_CENTER_VAULT_KEY_FILE: /run/secrets/control_center_vault_keys
      CONTROL_CENTER_VAULT_ACTIVE_KEY_ID: ${CONTROL_CENTER_VAULT_ACTIVE_KEY_ID:-}
      CONTROL_CENTER_VAULT_LEGACY_KEY_FILE: /run/secrets/projects_gateway_signing_keys
      CONTROL_CENTER_EXISTING_SECRETS_DIR: /var/www/infra-docs/secrets
      PROJECT_WORKER_JOBS_FILE: /var/www/project-state/worker-jobs.json
      PROJECT_IDENTITY_ACCESS_FILE: /var/www/project-state/identity-access.json
      PROJECT_DEPLOYMENTS_FILE: /var/www/project-state/deployments.jsonl
      PROJECT_BACKUP_RECORDS_FILE: /var/www/project-state/backups.jsonl
      PROJECT_RESOURCE_LIMITS_FILE: /var/www/project-state/resource-limits.json
      PROJECT_DOCKER_STATS_FILE: /var/www/project-state/docker-stats.json
      CONTROL_CENTER_DOCKER_STATS_MAX_AGE_SECONDS: ${CONTROL_CENTER_DOCKER_STATS_MAX_AGE_SECONDS:-15}
      PROJECT_SECURITY_POLICIES_FILE: /var/www/project-state/security-policies.json
      PROJECT_ALERTS_FILE: /var/www/project-state/alerts.json
      PROJECT_NOTIFICATION_CHANNELS_FILE: /var/www/project-state/notification-channels.json
      PROJECT_PROVIDER_CONNECTIONS_FILE: /var/www/project-state/provider-connections.json
      PROJECT_SETTINGS_FILE: /var/www/project-state/settings.json
      PROJECT_WEBSPACES_FILE: /var/www/project-state/webspaces.json
      PLATFORM_NAME: ${PLATFORM_NAME:-Platform Infrastructure}
      PROJECT_NAME: ${PROJECT_NAME:-platform}
      DOMAIN: ${DOMAIN:-localhost.com}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost.com}
      PROVIDER_PROFILE: ${PROVIDER_PROFILE:-local}
      ADMIN_HOST: ${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}
      CONTROL_CENTER_HOST: ${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}}
      DOCS_HOST: ${DOCS_HOST:-docs.${DOMAIN:-localhost.com}}
      CONTROL_CENTER_PUBLIC_ROOT: /app/public
      PROJECTS_HOST: ${PROJECTS_HOST:-}
      PROJECT_HOST_SUFFIX: ${PROJECT_HOST_SUFFIX:-.localhost.com}
      NODE_PROJECT_HOSTS: ${NODE_PROJECT_HOSTS:-}
    volumes:
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects:ro
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./projects-portal/state:/var/www/project-state
    secrets:
      - projects_gateway_signing_keys
      - control_center_vault_keys
      - control_center_database_url
      - mariadb_root_password
      - postgres_superuser_password
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/__health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  project-router:
    image: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
    container_name: enterprise-project-router
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    working_dir: /app
    command:
      - node
      - /app/server.mjs
    expose:
      - "8080"
    environment:
      PROJECT_ROUTER_PORT: 8080
      PROJECTS_ROOT: /var/www/projects
      PROJECT_STATE_FILE: /var/www/project-state/projects.json
      PROJECT_ROUTER_WORKLOAD_LOCK_FILE: /var/www/project-state/hosted-workloads.lock.json
      CONTROL_CENTER_HOST: ${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}}
      ADMIN_HOST: ${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}
      PROJECTS_HOST: ${PROJECTS_HOST:-}
      PROJECT_HOST_SUFFIX: ${PROJECT_HOST_SUFFIX:-.localhost.com}
      CONTROL_CENTER_UPSTREAM: http://control-center:8080
      NODE_PROJECT_HOSTS: ${NODE_PROJECT_HOSTS:-}
      PROJECT_UPSTREAMS: ${PROJECT_UPSTREAMS:-}
      PHP_PROJECT_UPSTREAMS: ${PHP_PROJECT_UPSTREAMS:-}
      NODE_PROJECT_UPSTREAMS: ${NODE_PROJECT_UPSTREAMS:-}
      STATIC_PROJECT_UPSTREAMS: ${STATIC_PROJECT_UPSTREAMS:-}
      PROJECT_ROUTER_ALLOWED_UPSTREAMS: ${PROJECT_ROUTER_ALLOWED_UPSTREAMS:-control-center:8080}
    volumes:
      - ./project-router:/app:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker
      - ./projects-portal/state:/var/www/project-state
    depends_on:
      control-center:
        condition: service_healthy
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/__health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:12.3.2@sha256:b1c7bf836e64ed9406a8984af29509f40089d55cea14b32f12c4726a1f17104b}
    container_name: mariadb
    init: true
    pids_limit: 1024
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${LOCAL_MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - enterprise_mariadb_data:/var/lib/mysql
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./traefik/certs:/etc/mysql/ssl:ro
    networks:
      enterprise_net:
        aliases:
          - platform.local
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" -N -e 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin:5.2.3@sha256:b16dc88d6e62b186dc4864adac4996fe0238587aa9f5ed507dcfc3894903a3f6}
    container_name: phpmyadmin
    profiles:
      - admin
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      PMA_HOST: platform.local
      PMA_PORT: 3306
      PMA_SSL_CA: /etc/phpmyadmin/certs/ca.pem
      PMA_SSL_VERIFIES: "1"
      UPLOAD_LIMIT: 256M
    volumes:
      - ./phpmyadmin/apache-forwarded-proto.conf:/etc/apache2/conf-enabled/forwarded-proto.conf:ro
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
      - ./traefik/certs:/etc/phpmyadmin/certs:ro
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - enterprise_net

  phppgadmin:
    image: ${PHPPGADMIN_IMAGE:-tozd/phppgadmin@sha256:2c146e25719c3712dd3190c2b59689f20448c2fa7b595f89be06214ddc89f1fd}
    container_name: phppgadmin
    profiles:
      - admin
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      PHPPGADMIN_HOST: ${CONTROL_CENTER_POSTGRES_HOST:-postgres}
      PHPPGADMIN_PORT: ${CONTROL_CENTER_POSTGRES_PORT:-5432}
    volumes:
      - ./phppgadmin/config.inc.php:/etc/phppgadmin/config.inc.php:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - enterprise_net

  local-dns:
    image: ${COREDNS_IMAGE:-coredns/coredns:1.13.1@sha256:9b9128672209474da07c91439bf15ed704ae05ad918dd6454e5b6ae14e35fee6}
    container_name: enterprise-local-dns
    profiles:
      - dns
    init: true
    pids_limit: 128
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns:/etc/coredns:ro
    expose:
      - "53/tcp"
      - "53/udp"
    networks:
      - enterprise_net

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac}
    container_name: enterprise-prometheus
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    depends_on:
      alertmanager:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    volumes:
      - enterprise_prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.10.2@sha256:3ac34ce007accad95afed72149e0d2b927b7e42fd1c866149b945b84737c62c3}
    container_name: enterprise-node-exporter
    init: true
    pids_limit: 128
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/netns)($|/)
      - --collector.netclass.ignored-devices=^(veth.*|br-.*|docker.*)$
    pid: host
    volumes:
      - /:/host:ro
      - ./projects-portal/state/node-exporter-textfile:/var/lib/node-exporter/textfile:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9100/metrics"]
      interval: 20s
      timeout: 5s
      retries: 10

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435}
    container_name: enterprise-cadvisor
    init: true
    pids_limit: 256
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10

  platform-alert-dispatcher:
    image: ${PLATFORM_ALERT_DISPATCHER_IMAGE:-platform/alert-dispatcher:local}
    build:
      context: .
      dockerfile: docker/alert-dispatcher.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
    container_name: enterprise-platform-alert-dispatcher
    init: true
    user: "1000:1000"
    read_only: true
    pids_limit: 128
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      PORT: "3000"
      ALERTMANAGER_WEBHOOK_TOKEN_FILE: /run/secrets/alertmanager_webhook_token
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Set ALERT_EMAIL_TO}
      ALERT_FORWARD_WEBHOOK_URL_FILE: ${ALERT_FORWARD_WEBHOOK_URL_FILE:-}
      MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
      MAILER_REPLY_TO: ${MAILER_REPLY_TO:?Set MAILER_REPLY_TO}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    expose:
      - "3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.32.2@sha256:b85533a2eb45865835315810315f6951331b2dbc8c93a6cf9a51e156a006a706}
    container_name: enterprise-alertmanager
    init: true
    pids_limit: 256
    group_add:
      - "${ALERTMANAGER_SECRET_GID:-1000}"
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      platform-alert-dispatcher:
        condition: service_healthy
    volumes:
      - enterprise_alertmanager_data:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/secrets/alertmanager_webhook_token && wget -q -O /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2}
    container_name: enterprise-grafana
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://grafana:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - enterprise_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - enterprise_net
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86}
    container_name: enterprise-loki
    init: true
    pids_limit: 512
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    depends_on:
      alertmanager:
        condition: service_healthy
    volumes:
      - enterprise_loki_data:/loki
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ./loki/rules:/loki/rules:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 15

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.6.10@sha256:2a0f5e3e160ee5d549c585f6cc4f4e1c566ff783324a424bd75bc16503fc660e}
    container_name: enterprise-promtail
    init: true
    pids_limit: 256
    logging: *default_logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD", "/usr/bin/promtail", "-version"]
      interval: 20s
      timeout: 5s
      retries: 10

networks:
  enterprise_net:
    external: true
    name: enterprise_net

volumes:
  enterprise_mariadb_data:
    name: ${MARIADB_DATA_VOLUME:-enterprise_mariadb_data}
    external: true
  enterprise_postgres_data:
    name: enterprise_postgres_data
  enterprise_redis_data:
    name: enterprise_redis_data
  enterprise_keycloak_data:
    name: enterprise_keycloak_data
  enterprise_nats_data:
    name: enterprise_nats_data
  enterprise_minio_data:
    name: enterprise_minio_data
  enterprise_alertmanager_data:
    name: enterprise_alertmanager_data
  enterprise_grafana_data:
    name: enterprise_grafana_data
  enterprise_prometheus_data:
    name: enterprise_prometheus_data
  enterprise_loki_data:
    name: enterprise_loki_data

configs:
  enterprise_traefik_routes:
    content: |
      http:
        routers:
          enterprise-docs-http:
            rule: Host(`${DOCS_HOST:-docs.localhost.com}`)
            entryPoints:
              - web
            middlewares:
              - enterprise-redirect-https@file
            priority: 100
            service: enterprise-docs

          enterprise-docs:
            rule: Host(`${DOCS_HOST:-docs.localhost.com}`)
            entryPoints:
              - websecure
            priority: 100
            tls: {}
            middlewares:
              - enterprise-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-docs

          enterprise-portal-http:
            rule: Host(`${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}}`)
            entryPoints:
              - web
            middlewares:
              - enterprise-redirect-https@file
            priority: 100
            service: enterprise-portal

          enterprise-portal:
            rule: Host(`${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:-localhost.com}}}`)
            entryPoints:
              - websecure
            priority: 100
            tls: {}
            middlewares:
              - enterprise-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-portal

          enterprise-identity-http:
            rule: Host(`${AUTH_HOST:-auth.${DOMAIN:-localhost.com}}`)
            entryPoints:
              - web
            middlewares:
              - enterprise-redirect-https@file
            priority: 200
            service: enterprise-identity

          enterprise-identity:
            rule: Host(`${AUTH_HOST:-auth.${DOMAIN:-localhost.com}}`)
            entryPoints:
              - websecure
            priority: 200
            tls: {}
            middlewares:
              - keycloak-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-identity

        services:
          enterprise-docs:
            loadBalancer:
              servers:
                - url: http://control-center:8080
          enterprise-portal:
            loadBalancer:
              servers:
                - url: http://control-center:8080
          enterprise-identity:
            loadBalancer:
              servers:
                - url: http://keycloak:8080

secrets:
  control_center_database_url:
    file: ${CONTROL_CENTER_DATABASE_URL_SECRET_FILE:-./secrets/control_center_database_url.txt}
  control_center_vault_keys:
    file: ${CONTROL_CENTER_VAULT_KEYS_SECRET_FILE:-./secrets/control_center_vault_keys.txt}
  projects_gateway_signing_keys:
    file: ${PROJECTS_GATEWAY_SIGNING_KEYS_SECRET_FILE:-./secrets/projects_gateway_signing_keys.txt}
  smtp_password:
    file: ${SMTP_PASSWORD_SECRET_FILE:-./secrets/smtp_password.txt}
