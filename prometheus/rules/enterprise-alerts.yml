groups:
  - name: platform-enterprise-health
    rules:
      - alert: PlatformTargetDown
        expr: up{job=~"traefik|prometheus|alertmanager|platform-alert-dispatcher|keycloak|node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Platform target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} is not scrapeable."

      - alert: KeycloakPlatformLoginFailures
        expr: sum(increase(keycloak_user_events_total{realm="platform",event="login",error!=""}[5m])) >= 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Repeated platform identity login failures"
          description: "Keycloak recorded at least five failed platform-realm logins in five minutes."

      - alert: KeycloakPlatformAdminLocked
        expr: sum(increase(keycloak_user_events_total{realm="platform",event=~"user_disabled_by_temporary_lockout|user_disabled_by_permanent_lockout"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Platform administrator locked by Keycloak"
          description: "Review the identity audit and use the separate passkey-only break-glass path if required."

      - alert: BackupStale
        expr: backup_restore_last_success_age_seconds{operation="backup"} < 0 or backup_restore_last_success_age_seconds{operation="backup"} > 172800
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Platform backup is stale or missing"
          description: "No successful catalog backup has been recorded in the last 48 hours."

      - alert: RestoreDrillStale
        expr: backup_restore_last_success_age_seconds{operation="restore_test"} < 0 or backup_restore_last_success_age_seconds{operation="restore_test"} > 3024000
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Restore drill is stale or missing"
          description: "No successful restore test has been recorded in the last 35 days."

      - alert: AlertDeliveryFailed
        expr: increase(platform_alert_delivery_total{result="failed"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Platform alert delivery failed"
          description: "The platform alert dispatcher failed every configured delivery attempt."

      - alert: HostDiskUsageHigh
        expr: 100 - ((node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay"} * 100) / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk usage is high"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is above 85% usage."

      - alert: HostDiskUsageCritical
        expr: 100 - ((node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay"} * 100) / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay"}) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host disk usage is critical"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is above 95% usage."

      - alert: HostDiskWillFillSoon
        expr: predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Host filesystem may fill within 24 hours"
          description: "Recent growth predicts exhaustion of {{ $labels.mountpoint }} within 24 hours."

      - alert: HostMemoryUsageHigh
        expr: 100 * (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage is high"
          description: "Memory usage on {{ $labels.instance }} is above 85%."

      - alert: HostCpuUsageHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: "CPU usage on {{ $labels.instance }} is above 85% for 15 minutes."

      - alert: ContainerCpuUsageHigh
        expr: platform_container_cpu_percent > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU usage is high"
          description: "{{ $labels.container }} is using more than 80% of one CPU core for 10 minutes."

      - alert: ContainerMemoryUsageHigh
        expr: ((platform_container_memory_usage_bytes / on(container, compose_project, compose_service) platform_container_memory_limit_bytes) * 100 > 90) or (platform_container_memory_usage_bytes > 1073741824 unless on(container, compose_project, compose_service) platform_container_memory_limit_bytes)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container memory usage is high"
          description: "{{ $labels.container }} is above 90% of its effective memory limit, or above 1GiB while unlimited."

      - alert: ContainerDisappeared
        expr: absent(platform_container_metrics_collector_healthy) or platform_container_metrics_collector_healthy == 0 or (time() - platform_container_metrics_collector_last_attempt_timestamp_seconds > 30) or (platform_container_metrics_collector_expected_running != platform_container_metrics_collector_observed)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container workload metrics are incomplete"
          description: "The host collector is missing, stale, unhealthy, or did not sample every container Docker reports as running."
