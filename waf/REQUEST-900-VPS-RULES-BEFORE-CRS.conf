# Stream Google OAuth callback: the issuer and userinfo scopes are literal
# protocol metadata. CRS 931130 mistakes their Google HTTPS URLs for remote
# file inclusion (score 10). Restrict the target exclusion to the exact host,
# GET callback, single argument and known Google value/closed scope vocabulary.
# Code, state, other arguments, other rules and all downstream OAuth identity,
# state, expiry and account checks remain active.
SecRule REQUEST_HEADERS:Host "@rx (?i)^stream\.platform-infrastructure\.com$" \
    "id:1000121,phase:2,pass,nolog,msg:'Allow Google issuer on exact Stream OAuth callback',tag:'platform-waf/stream-google-oauth',chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,chain"
        SecRule REQUEST_FILENAME "@rx \A/account/google/callback(?:\.php)?\z" \
            "t:none,chain"
            SecRule &ARGS:iss "@eq 1" \
                "t:none,chain"
                SecRule &ARGS_GET:iss "@eq 1" \
                    "t:none,chain"
                    SecRule ARGS:iss "@streq https://accounts.google.com" \
                    "t:none,ctl:ruleRemoveTargetById=931130;ARGS:iss"

SecRule REQUEST_HEADERS:Host "@rx (?i)^stream\.platform-infrastructure\.com$" \
    "id:1000122,phase:2,pass,nolog,msg:'Allow Google userinfo scopes on exact Stream OAuth callback',tag:'platform-waf/stream-google-oauth',chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,chain"
        SecRule REQUEST_FILENAME "@rx \A/account/google/callback(?:\.php)?\z" \
            "t:none,chain"
            SecRule &ARGS:scope "@eq 1" \
                "t:none,chain"
                SecRule &ARGS_GET:scope "@eq 1" \
                    "t:none,chain"
                    SecRule ARGS:scope "@rx \A(?:openid|email|profile|https://www\.googleapis\.com/auth/userinfo\.(?:email|profile))(?: (?:openid|email|profile|https://www\.googleapis\.com/auth/userinfo\.(?:email|profile))){0,4}\z" \
                    "t:none,ctl:ruleRemoveTargetById=931130;ARGS:scope"

# Scripta private DNS-over-HTTPS uses RFC 8484 binary messages, including on
# iOS GET requests. Only this exact host/path/method/media-type may use the
# DNS content type. Do not parse binary DNS as URL-encoded form fields.
# WAF scoring, framing checks, headers, query arguments and all other routes
# remain inspected; CoreDNS is authoritative only for the Scripta zone.
SecRule REQUEST_HEADERS:Host "@rx (?i)^scriptastudents\.platform-infrastructure\.com$" \
    "id:1000124,phase:1,pass,nolog,msg:'Allow DNS wire format on exact Scripta DoH endpoint',tag:'platform-waf/scripta-doh',chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,chain"
        SecRule REQUEST_FILENAME "@streq /dns-query" \
            "t:none,chain"
            SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Aapplication/dns-message\z" \
                "t:none,setvar:'tx.allowed_request_content_type=|application/dns-message|',setvar:'tx.enforce_bodyproc_urlencoded=0'"

# Record whether any argument OTHER THAN content exceeds the unchanged generic
# limit. CRS 920370 is a chain whose inner ARGS target cannot be removed with
# ruleRemoveTargetById in this ModSecurity build, so its guarded exception below
# applies only when no other argument could have triggered the original rule.
SecRule ARGS|!ARGS:json.content "@gt 4096" \
    "id:1000127,phase:2,pass,nolog,t:none,t:length,setvar:tx.scripta_note_other_arg_too_long=1"

# Scripta notes: the API accepts bounded literal study text. CRS 920370's
# generic 4096-byte limit blocks ordinary 7 KB notes. Exclude only this value,
# only while it is within 100000 bytes; retain the total argument/body limits,
# other fields, authentication, Origin validation and all other CRS rules.
SecRule REQUEST_HEADERS:Host "@rx (?i)\Ascriptastudents\.platform-infrastructure\.com\z" \
    "id:1000125,phase:2,pass,nolog,msg:'Allow bounded Scripta note content length',tag:'platform-waf/scripta-note',chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,chain"
        SecRule REQUEST_URI "@streq /api/note" \
            "t:none,chain"
            SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Aapplication/json(?:[ \t]*;[ \t]*charset=utf-8)?\z" \
                "t:none,chain"
                SecRule REQUEST_HEADERS:Origin "@streq https://scriptastudents.platform-infrastructure.com" \
                    "t:none,chain"
                    SecRule &ARGS:json.content "@eq 1" \
                        "t:none,chain"
                        SecRule ARGS:json.content "@le 100000" \
                            "t:none,t:length,chain"
                            SecRule &TX:SCRIPTA_NOTE_OTHER_ARG_TOO_LONG "@eq 0" \
                                "t:none,ctl:ruleRemoveById=920370"

# CRS 942200 treats a comma followed by a prose title ending in a-f as SQL.
# Confirmed against the literal educational title naming Dewey/Montessori.
# Titles are bounded strings, stored with SQL parameters and escaped in UI.
# Keep every other SQL rule and every other field/route/host inspected.
SecRule REQUEST_HEADERS:Host "@rx (?i)\Ascriptastudents\.platform-infrastructure\.com\z" \
    "id:1000126,phase:2,pass,nolog,msg:'Allow bounded Scripta note title prose',tag:'platform-waf/scripta-note',chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,chain"
        SecRule REQUEST_URI "@rx \A/api/(?:note|documents/[a-f0-9]{8}-[a-f0-9]{4}-[1-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12})\z" \
            "t:none,chain"
            SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Aapplication/json(?:[ \t]*;[ \t]*charset=utf-8)?\z" \
                "t:none,chain"
                SecRule REQUEST_HEADERS:Origin "@streq https://scriptastudents.platform-infrastructure.com" \
                    "t:none,chain"
                    SecRule &ARGS:json.title "@eq 1" \
                        "t:none,chain"
                        SecRule ARGS:json.title "@le 160" \
                            "t:none,t:length,ctl:ruleRemoveTargetById=942200;ARGS:json.title"

# Apple-generated text is bounded literal content, validated against the
# server-owned task schema before it can become an AI result. Track the
# unchanged 4096-byte limit for every other argument before considering an
# exception for the two chained CRS size rules.
SecRule ARGS|!ARGS:json.text "@gt 4096" \
    "id:1000128,phase:2,pass,nolog,t:none,t:length,setvar:tx.scripta_apple_other_arg_too_long=1"

# MATCHED_VAR is the byte length after t:length. The remaining combined size
# includes every other argument and all argument names, preserving a 5000-byte
# envelope for metadata. This is calculated only for text <= 60000 UTF-8 bytes.
SecRule ARGS:json.text "@le 60000" \
    "id:1000129,phase:2,pass,nolog,t:none,t:length,setvar:tx.scripta_apple_other_args_length=%{ARGS_COMBINED_SIZE},setvar:tx.scripta_apple_other_args_length=-%{MATCHED_VAR}"

# Additional verified prose/reference false positives: 931130, 942150, 942410.
# Source URLs are literal text; this result endpoint does not fetch them.
# Reproduced against actual pedagogical prose / JSON: 932236, 932240, 942200,
# 942430, plus the generic argument (4096) and total (32768) size limits.
# Exclude only those content signatures and only this exact native result
# boundary. Every other field, signature, host, path and request framing check
# remains active. Authentication and account-owned expiring tasks stay mandatory.
SecRule REQUEST_HEADERS:Host "@rx (?i)\Ascriptastudents\.platform-infrastructure\.com\z" \
    "id:1000130,phase:2,pass,nolog,msg:'Allow bounded literal Apple Intelligence result text',tag:'platform-waf/scripta-apple-result',chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,chain"
        SecRule REQUEST_URI "@streq /api/ai/apple/results" \
            "t:none,chain"
            SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Aapplication/json(?:[ \t]*;[ \t]*charset=utf-8)?\z" \
                "t:none,chain"
                SecRule REQUEST_HEADERS:Origin "@streq https://scriptastudents.platform-infrastructure.com" \
                    "t:none,chain"
                    SecRule &ARGS:json.text "@eq 1" \
                        "t:none,chain"
                        SecRule &TX:SCRIPTA_APPLE_OTHER_ARGS_LENGTH "@eq 1" \
                            "t:none,chain"
                            SecRule &TX:SCRIPTA_APPLE_OTHER_ARG_TOO_LONG "@eq 0" \
                                "t:none,chain"
                                SecRule TX:SCRIPTA_APPLE_OTHER_ARGS_LENGTH "@le 5000" \
                                    "t:none,chain"
                                    SecRule ARGS_COMBINED_SIZE "@le 65000" \
                                        "t:none,ctl:ruleRemoveById=920370,ctl:ruleRemoveById=920390,ctl:ruleRemoveTargetById=932236;ARGS:json.text,ctl:ruleRemoveTargetById=932240;ARGS:json.text,ctl:ruleRemoveTargetById=942200;ARGS:json.text,ctl:ruleRemoveTargetById=942430;ARGS:json.text,ctl:ruleRemoveTargetById=942340;ARGS:json.text,ctl:ruleRemoveTargetById=942370;ARGS:json.text,ctl:ruleRemoveTargetById=932200;ARGS:json.text,ctl:ruleRemoveTargetById=941340;ARGS:json.text,ctl:ruleRemoveTargetById=942131;ARGS:json.text,ctl:ruleRemoveTargetById=942300;ARGS:json.text,ctl:ruleRemoveTargetById=942330;ARGS:json.text,ctl:ruleRemoveTargetById=942440;ARGS:json.text,ctl:ruleRemoveTargetById=931130;ARGS:json.text,ctl:ruleRemoveTargetById=942150;ARGS:json.text,ctl:ruleRemoveTargetById=942410;ARGS:json.text"

# Versioned map files are JSON-only study data (no HTML, SVG or executable
# content). The map API validates its closed model, limits raw file UTF-8 bytes
# to 150000, verifies ownership/revision and stores with parameterized SQL.
# Reproduced 942200/942330/942340/942370/942430 false positives come from serialized JSON.
# Concept formulas and literal references also reproduce 931130, 932200,
# 932240, 941340, 942131 and 942440 in this bounded, validated JSON file.
# Confirmed CRS 942380 misreads serialized from/to identifiers as SQL;
# CRS 932236 misreads Italian prose after a semicolon (for example ; la) as a command.
# Allow only the bounded file scalar plus a safe numeric revision on the exact
# canonical map-save route. Keep all other signatures and routes inspected.
# Since there are exactly two arguments and revision is at most 16 digits,
# only file can exceed the generic argument/combined-size limits below.
SecRule REQUEST_HEADERS:Host "@rx (?i)\Ascriptastudents\.platform-infrastructure\.com\z" \
    "id:1000131,phase:2,pass,nolog,msg:'Allow bounded versioned Scripta map file',tag:'platform-waf/scripta-map-file',chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,chain"
        SecRule REQUEST_URI "@rx \A/api/documents/[a-f0-9]{8}-[a-f0-9]{4}-[1-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}/maps/[a-f0-9]{8}-[a-f0-9]{4}-[1-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}\z" \
            "t:none,chain"
            SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Aapplication/json(?:[ \t]*;[ \t]*charset=utf-8)?\z" \
                "t:none,chain"
                SecRule REQUEST_HEADERS:Origin "@streq https://scriptastudents.platform-infrastructure.com" \
                    "t:none,chain"
                    SecRule &ARGS "@eq 2" \
                        "t:none,chain"
                        SecRule &ARGS:json.revision "@eq 1" \
                            "t:none,chain"
                            SecRule ARGS:json.revision "@rx \A(?:0|[1-9][0-9]{0,15})\z" \
                                "t:none,chain"
                                SecRule ARGS:json.revision "@le 9007199254740991" \
                                    "t:none,chain"
                                    SecRule &ARGS:json.file "@eq 1" \
                                        "t:none,chain"
                                        SecRule ARGS:json.file "@le 150000" \
                                            "t:none,t:length,chain"
                                            SecRule ARGS_COMBINED_SIZE "@le 150064" \
                                                "t:none,ctl:ruleRemoveById=920370,ctl:ruleRemoveById=920390,ctl:ruleRemoveTargetById=942200;ARGS:json.file,ctl:ruleRemoveTargetById=942370;ARGS:json.file,ctl:ruleRemoveTargetById=942430;ARGS:json.file,ctl:ruleRemoveTargetById=942330;ARGS:json.file,ctl:ruleRemoveTargetById=942340;ARGS:json.file,ctl:ruleRemoveTargetById=931130;ARGS:json.file,ctl:ruleRemoveTargetById=932200;ARGS:json.file,ctl:ruleRemoveTargetById=932240;ARGS:json.file,ctl:ruleRemoveTargetById=941340;ARGS:json.file,ctl:ruleRemoveTargetById=942131;ARGS:json.file,ctl:ruleRemoveTargetById=942440;ARGS:json.file,ctl:ruleRemoveTargetById=942520;ARGS:json.file,ctl:ruleRemoveTargetById=942380;ARGS:json.file,ctl:ruleRemoveTargetById=932236;ARGS:json.file"

# Live transcription rewrite accepts bounded literal study text. Synthetic Italian
# prose and LaTeX reproduce CRS 932236, 942131 and 942430 in json.content.
# Longer educational prose, formulas and references also reproduce 931130,
# 932200, 932240, 942150, 942200 and 942410. Content is source text for AI;
# reference URLs in this field are never fetched or executed.
# This field is never evaluated as SQL or shell; AI output has a closed document
# schema. Limit the exception to this exact authenticated endpoint's three fields.
# Other targets, all other signatures, auth, Origin and body framing stay active.
SecRule REQUEST_HEADERS:Host "@rx (?i)\Ascriptastudents\.platform-infrastructure\.com\z" \
    "id:1000132,phase:2,pass,nolog,msg:'Allow bounded literal live transcription rewrite text',tag:'platform-waf/scripta-live-rewrite',chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,chain"
        SecRule REQUEST_URI "@streq /api/ai/rewrite" \
            "t:none,chain"
            SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Aapplication/json(?:[ \t]*;[ \t]*charset=utf-8)?\z" \
                "t:none,chain"
                SecRule REQUEST_HEADERS:Origin "@streq https://scriptastudents.platform-infrastructure.com" \
                    "t:none,chain"
                    SecRule &ARGS "@eq 3" \
                        "t:none,chain"
                        SecRule &ARGS:json.noteId "@eq 1" \
                            "t:none,chain"
                            SecRule ARGS:json.noteId "@rx \A[a-f0-9]{8}-[a-f0-9]{4}-[1-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}\z" \
                                "t:none,chain"
                                SecRule &ARGS:json.locale "@eq 1" \
                                    "t:none,chain"
                                    SecRule ARGS:json.locale "@rx \A[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8}){0,3}\z" \
                                        "t:none,chain"
                                        SecRule &ARGS:json.content "@eq 1" \
                                            "t:none,chain"
                                            SecRule ARGS:json.content "@le 100000" \
                                                "t:none,t:length,chain"
                                                SecRule ARGS_COMBINED_SIZE "@le 100128" \
                                                    "t:none,ctl:ruleRemoveById=920370,ctl:ruleRemoveById=920390,ctl:ruleRemoveTargetById=932236;ARGS:json.content,ctl:ruleRemoveTargetById=942131;ARGS:json.content,ctl:ruleRemoveTargetById=942430;ARGS:json.content,ctl:ruleRemoveTargetById=931130;ARGS:json.content,ctl:ruleRemoveTargetById=932200;ARGS:json.content,ctl:ruleRemoveTargetById=932240;ARGS:json.content,ctl:ruleRemoveTargetById=942150;ARGS:json.content,ctl:ruleRemoveTargetById=942200;ARGS:json.content,ctl:ruleRemoveTargetById=942410;ARGS:json.content"
