services:
  traefik:
    restart: always
    command:
      - --configFile=/etc/traefik/traefik.prod.yml
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Set TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./traefik/traefik.prod.yml:/etc/traefik/traefik.prod.yml:ro
      - ./traefik/dynamic/middlewares.yml:/etc/traefik/dynamic/middlewares.yml:ro
      - ./traefik/acme:/letsencrypt

  postgres:
    restart: always
    ports: !reset []

  redis:
    restart: always
    ports: !reset []

  keycloak:
    restart: always
    command: ["start", "--http-port=8080", "--import-realm"]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-${AUTH_HOST:-keycloak.local}}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports: !reset []
    labels:
      traefik.enable: "false"

  nats:
    restart: always
    ports: !reset []

  minio:
    restart: always
    ports: !reset []
    labels:
      traefik.enable: "false"

  prometheus:
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports: !reset []

  alertmanager:
    restart: always
    ports: !reset []

  platform-alert-dispatcher:
    restart: always

  grafana:
    restart: always
    ports: !reset []
    labels:
      traefik.enable: "false"

  loki:
    restart: always
    ports: !reset []

  promtail:
    restart: always

configs:
  enterprise_traefik_routes:
    content: |
      http:
        routers:
          enterprise-portal:
            rule: Host(`${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:?Set DOMAIN}}}`)
            entryPoints:
              - websecure
            priority: 100
            tls:
              certResolver: letsencrypt
            middlewares:
              - enterprise-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-portal

          enterprise-docs:
            rule: Host(`${DOCS_HOST:-docs.${DOMAIN:?Set DOMAIN}}`)
            entryPoints:
              - websecure
            priority: 100
            tls:
              certResolver: letsencrypt
            middlewares:
              - enterprise-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-docs

        services:
          enterprise-docs:
            loadBalancer:
              servers:
                - url: http://control-center:8080
          enterprise-portal:
            loadBalancer:
              servers:
                - url: http://control-center:8080
