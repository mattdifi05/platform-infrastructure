# Production HA overlay.
#
# Use with:
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.ha.yaml config --quiet
#
# This overlay applies placement constraints to platform-owned stateful services.
# Hosted workloads own their replica and rollout policy in their external overlay.
# Stateful HA still requires managed or clustered PostgreSQL, Redis, NATS and
# object storage; see ENTERPRISE-10-PLAN.md.
x-platform-ha-rollout: &platform-ha-rollout
  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 30s

services:
  control-center:
    deploy:
      <<: *platform-ha-rollout

  project-router:
    deploy:
      <<: *platform-ha-rollout

  platform-alert-dispatcher:
    deploy:
      <<: *platform-ha-rollout

  postgres:
    deploy:
      placement:
        constraints:
          - node.labels.platform.stateful == true

  redis:
    deploy:
      placement:
        constraints:
          - node.labels.platform.stateful == true

  nats:
    deploy:
      placement:
        constraints:
          - node.labels.platform.stateful == true

  minio:
    deploy:
      placement:
        constraints:
          - node.labels.platform.stateful == true
