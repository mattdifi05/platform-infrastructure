# T13 single-node runtime isolation overlay. Load last so these limits and
# mount allowlists are authoritative for the VPS profile.
x-runtime-core: &runtime_core
  cpu_shares: 768
  ulimits:
    nofile:
      soft: 16384
      hard: 16384
  blkio_config:
    weight: 600

x-runtime-control: &runtime_control
  cpu_shares: 1024
  ulimits:
    nofile:
      soft: 16384
      hard: 16384
  blkio_config:
    weight: 700

x-runtime-app: &runtime_app
  cpu_shares: 256
  ulimits:
    nofile:
      soft: 8192
      hard: 8192
  blkio_config:
    weight: 300

x-runtime-observability: &runtime_observability
  cpu_shares: 512
  ulimits:
    nofile:
      soft: 8192
      hard: 8192
  blkio_config:
    weight: 400

services:
  docker-operation-gateway:
    <<: *runtime_control
    read_only: true
    cpus: 0.50
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /root:rw,noexec,nosuid,nodev,size=16m
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/infra:ro
      - ./backups:/infra/backups
      - ./reports:/infra/reports
      - ./projects-portal/state:/var/www/project-state
      - ${PROJECT_SOURCE_DIR:-../src}:/project:ro
    networks: !override
      - platform_docker_control
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  traefik:
    <<: *runtime_control
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 192

  waf:
    <<: *runtime_control
    cpus: 1.00
    mem_limit: 384m
    mem_reservation: 96m
    pids_limit: 384

  postgres:
    <<: *runtime_core
    cpus: 1.00
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 768

  redis:
    <<: *runtime_core
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 192

  keycloak:
    <<: *runtime_core
    cpus: 1.50
    mem_limit: 1280m
    mem_reservation: 384m
    pids_limit: 768

  nats:
    <<: *runtime_core
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 192

  minio:
    <<: *runtime_core
    cpus: 1.00
    mem_limit: 768m
    mem_reservation: 192m
    pids_limit: 384

  php-apache:
    <<: *runtime_app
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 256

  control-center:
    <<: *runtime_control
    read_only: true
    cpus: 1.00
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 384
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes: !override
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects:ro
      - ./projects-portal/state:/var/www/project-state

  project-router:
    <<: *runtime_control
    read_only: true
    cpus: 0.50
    mem_limit: 192m
    mem_reservation: 48m
    pids_limit: 192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes: !override
      - ./project-router:/app:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects:ro
      - ./projects-portal/state:/var/www/project-state:ro

  mariadb:
    <<: *runtime_core
    cpus: 1.50
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 768

  phpmyadmin:
    <<: *runtime_app
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 48m
    pids_limit: 256

  phppgadmin:
    <<: *runtime_app
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 48m
    pids_limit: 256

  local-dns:
    <<: *runtime_core
    cpus: 0.10
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 64

  prometheus:
    <<: *runtime_observability
    cpus: 0.50
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 320

  node-exporter:
    <<: *runtime_observability
    cpus: 0.15
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 96

  cadvisor:
    <<: *runtime_observability
    cpus: 0.25
    mem_limit: 192m
    mem_reservation: 48m
    pids_limit: 192

  alertmanager:
    <<: *runtime_observability
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 128

  platform-alert-dispatcher:
    <<: *runtime_observability
    cpus: 0.20
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 128

  grafana:
    <<: *runtime_observability
    cpus: 0.50
    mem_limit: 384m
    mem_reservation: 96m
    pids_limit: 256

  loki:
    <<: *runtime_observability
    cpus: 0.50
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 320

  promtail:
    <<: *runtime_observability
    cpus: 0.25
    mem_limit: 192m
    mem_reservation: 48m
    pids_limit: 192

  local-registry:
    <<: *runtime_core
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 192

  backup-scheduler:
    <<: *runtime_control
    read_only: true
    cpus: 1.00
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    environment:
      PLATFORM_DOCKER_GATEWAY_URL: http://docker-operation-gateway:8787
      DOCKER_GATEWAY_TOKEN_FILE: /run/secrets/docker_gateway_token
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /root:rw,nosuid,nodev,size=32m
    volumes: !override
      - .:/infra:ro
      - ./backups:/infra/backups
      - ./reports:/infra/reports
      - ./projects-portal/state:/var/www/project-state
      - ${PROJECT_SOURCE_DIR:-../src}:/project:ro
      - backup_scheduler_logs:/var/log/platform
    depends_on:
      docker-operation-gateway:
        condition: service_healthy
    networks: !override
      - platform_db_admin
      - platform_storage
      - platform_egress
      - platform_docker_control

networks:
  platform_docker_control:
    name: ${COMPOSE_PROJECT_NAME:-platform_infra}_platform_docker_control
    internal: true
    driver: bridge
