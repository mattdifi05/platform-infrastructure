# T13 single-node runtime isolation overlay. Load last so these limits and
# mount allowlists are authoritative for the VPS profile.
x-runtime-core: &runtime_core
  cpu_shares: 768
  ulimits:
    nofile:
      soft: 16384
      hard: 16384
  blkio_config:
    weight: 600

x-runtime-control: &runtime_control
  cpu_shares: 1024
  ulimits:
    nofile:
      soft: 16384
      hard: 16384
  blkio_config:
    weight: 700

x-runtime-app: &runtime_app
  cpu_shares: 256
  ulimits:
    nofile:
      soft: 8192
      hard: 8192
  blkio_config:
    weight: 300

x-runtime-observability: &runtime_observability
  cpu_shares: 512
  ulimits:
    nofile:
      soft: 8192
      hard: 8192
  blkio_config:
    weight: 400

services:
  docker-action-activation-sidecar:
    <<: *runtime_control
    read_only: true
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 64
    network_mode: none
    volumes: !override
      - ${DOCKER_ACTION_ACTIVATION_INBOX:?set provider/admin-owned activation inbox}:/run/platform/provider-activation/inbox:ro
      - docker_action_activation_cas:/run/platform/docker-action-activation/by-bundle-sha256
    networks: !reset []

  docker-action-broker:
    <<: *runtime_control
    user: "0:0"
    read_only: true
    cpus: 0.50
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /root:rw,noexec,nosuid,nodev,size=16m
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker_action_broker_socket:/run/platform/docker-action-broker
      - docker_action_broker_state:/var/lib/platform/docker-action-broker
      - backup_scheduler_jobs:/run/platform/backup-jobs:ro
      - docker_action_activation_cas:/run/platform/docker-action-activation/by-bundle-sha256:ro
      - ${DOCKER_ACTION_RUNTIME_INTENT_FILE:?set root-owned runtime intent}:/run/platform/docker-action-trust/runtime-intent.json:ro
      - ${DOCKER_ACTION_ACTIVE_RECEIPT_FILE:?set root-owned active receipt}:/run/platform/docker-action-trust/active-receipt.json:ro
    networks: !reset []
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(fs.statSync('/run/platform/docker-action-broker/broker.sock').isSocket()?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  traefik:
    <<: *runtime_control
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 192

  waf:
    <<: *runtime_control
    cpus: 1.00
    mem_limit: 384m
    mem_reservation: 96m
    pids_limit: 384

  postgres:
    <<: *runtime_core
    cpus: 1.00
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 768

  broker-auth-bootstrap:
    <<: *runtime_core
    read_only: true
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 64

  redis:
    <<: *runtime_core
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 192

  keycloak:
    <<: *runtime_core
    cpus: 1.50
    mem_limit: 1280m
    mem_reservation: 384m
    pids_limit: 768

  nats:
    <<: *runtime_core
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 192

  minio:
    <<: *runtime_core
    cpus: 1.00
    mem_limit: 768m
    mem_reservation: 192m
    pids_limit: 384

  php-apache:
    <<: *runtime_app
    build: !reset null
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 256

  control-center:
    <<: *runtime_control
    build: !reset null
    read_only: true
    cpus: 1.00
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 384
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes: !override
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects:ro
      - ./projects-portal/state:/var/www/project-state

  project-router:
    <<: *runtime_control
    build: !reset null
    read_only: true
    cpus: 0.50
    mem_limit: 192m
    mem_reservation: 48m
    pids_limit: 192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes: !override
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects:ro
      - ./projects-portal/state:/var/www/project-state:ro
      - ${HOSTED_WORKLOAD_RUNTIME_LOCK_SOURCE:-./config/no-hosted-workloads.lock.json}:/run/platform/hosted-workloads.lock.json:ro

  mariadb:
    <<: *runtime_core
    cpus: 1.50
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 768

  phpmyadmin:
    <<: *runtime_app
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 48m
    pids_limit: 256

  phppgadmin:
    <<: *runtime_app
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 48m
    pids_limit: 256

  local-dns:
    <<: *runtime_core
    cpus: 0.10
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 64

  prometheus:
    <<: *runtime_observability
    cpus: 0.50
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 320

  node-exporter:
    <<: *runtime_observability
    cpus: 0.15
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 96

  cadvisor:
    <<: *runtime_observability
    cpus: 0.25
    mem_limit: 192m
    mem_reservation: 48m
    pids_limit: 192

  alertmanager:
    <<: *runtime_observability
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 128

  platform-alert-dispatcher:
    <<: *runtime_observability
    build: !reset null
    cpus: 0.20
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 128

  grafana:
    <<: *runtime_observability
    cpus: 0.50
    mem_limit: 384m
    mem_reservation: 96m
    pids_limit: 256

  loki:
    <<: *runtime_observability
    cpus: 0.50
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 320

  promtail:
    <<: *runtime_observability
    cpus: 0.25
    mem_limit: 192m
    mem_reservation: 48m
    pids_limit: 192

  local-registry:
    <<: *runtime_core
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 192

  backup-scheduler:
    <<: *runtime_control
    image: ${PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY:?set digest-pinned scheduler repository}@sha256:${PLATFORM_BACKUP_SCHEDULER_IMAGE_SHA256:?set scheduler image sha256}
    build: !reset null
    user: "0:0"
    read_only: true
    cpus: 1.00
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    entrypoint: !override
      - /opt/platform-backup-scheduler/backup-scheduler.sh
    command: !reset []
    cap_drop: !override
      - ALL
    cap_add: !reset []
    group_add: !reset []
    network_mode: none
    networks: !reset []
    ports: !reset []
    expose: !reset []
    environment: !override
      DOCKER_ACTION_BROKER_SOCKET: /run/platform/docker-action-broker/broker.sock
      DOCKER_ACTION_RUNTIME_INTENT_ID: ${DOCKER_ACTION_RUNTIME_INTENT_ID:?set admitted runtime intent id}
      DOCKER_ACTION_ACTIVE_RECEIPT_SHA256: ${DOCKER_ACTION_ACTIVE_RECEIPT_SHA256:?set admitted active receipt sha256}
      DOCKER_ACTION_COMBINED_RENDER_SHA256: ${DOCKER_ACTION_COMBINED_RENDER_SHA256:?set exact final combined render sha256}
      BACKUP_SCHEDULER_JOBS_DIR: /var/www/project-state/backup-jobs
      BACKUP_SCHEDULER_LOG_DIR: /var/log/platform
      BACKUP_SCHEDULER_CRON_FILE: /run/platform/backup-scheduler/crontabs/root
      BACKUP_SCHEDULER_ENV_FILE: /run/platform/backup-scheduler/backup-scheduler.env
    secrets: !override
      - source: docker_action_backup_catalog
        target: docker_action_backup_catalog
        uid: "0"
        gid: "0"
        mode: 256
      - source: docker_action_backup_job_execute
        target: docker_action_backup_job_execute
        uid: "0"
        gid: "0"
        mode: 256
      - source: docker_action_backup_prune_plan
        target: docker_action_backup_prune_plan
        uid: "0"
        gid: "0"
        mode: 256
      - source: docker_action_backup_prune_apply
        target: docker_action_backup_prune_apply
        uid: "0"
        gid: "0"
        mode: 256
      - source: docker_action_restore_drill_full
        target: docker_action_restore_drill_full
        uid: "0"
        gid: "0"
        mode: 256
      - source: docker_action_backup_offsite_sync
        target: docker_action_backup_offsite_sync
        uid: "0"
        gid: "0"
        mode: 256
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/platform/backup-scheduler:rw,noexec,nosuid,nodev,size=8m
    volumes: !override
      - backup_scheduler_jobs:/var/www/project-state/backup-jobs
      - backup_scheduler_logs:/var/log/platform
      - docker_action_broker_socket:/run/platform/docker-action-broker:ro
    depends_on: !override
      docker-action-broker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/platform/backup-scheduler/crontabs/root
      interval: 30s
      timeout: 5s
      retries: 5
