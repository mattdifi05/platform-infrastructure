http:
  middlewares:
    enterprise-security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          X-Permitted-Cross-Domain-Policies: none
          X-Content-Type-Options: nosniff
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"

    keycloak-security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          X-Permitted-Cross-Domain-Policies: none
          X-Content-Type-Options: nosniff
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"

    enterprise-db-admin-frame-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: no-referrer
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          X-Permitted-Cross-Domain-Policies: none
          X-Content-Type-Options: nosniff
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"

    enterprise-edge-forwarded-https:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Port: "443"

    enterprise-rate-limit:
      rateLimit:
        average: 120
        burst: 60
        period: 1m
        # The WAF appends its direct peer to X-Forwarded-For. Scan from the
        # right, skip only Cloudflare's pinned proxy ranges, and key on the
        # first untrusted address. Do not combine excludedIPs with depth.
        sourceCriterion:
          ipStrategy:
            excludedIPs:
              - "103.21.244.0/22"
              - "103.22.200.0/22"
              - "103.31.4.0/22"
              - "104.16.0.0/13"
              - "104.24.0.0/14"
              - "108.162.192.0/18"
              - "131.0.72.0/22"
              - "141.101.64.0/18"
              - "162.158.0.0/15"
              - "172.64.0.0/13"
              - "173.245.48.0/20"
              - "188.114.96.0/20"
              - "190.93.240.0/20"
              - "197.234.240.0/22"
              - "198.41.128.0/17"
              - "2400:cb00::/32"
              - "2405:8100::/32"
              - "2405:b500::/32"
              - "2606:4700::/32"
              - "2803:f800::/32"
              - "2a06:98c0::/29"
              - "2c0f:f248::/32"

    enterprise-compress:
      compress: {}

    enterprise-redirect-https:
      redirectScheme:
        scheme: https
        permanent: true
