[Service]
# Capture DB/tree/config evidence first. The replacement ExecStart omits only
# the exact live GPG passphrase leaf from the new encrypted host capsule.
ExecStartPre=/usr/bin/python3 /usr/local/libexec/platform-mounted-config-g18/host/capture_mounted_config_trees.py
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/platform-mounted-config-v5/host/host_recovery_capsule_v5.py
TimeoutStartSec=7200
