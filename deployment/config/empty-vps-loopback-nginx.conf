worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
  # Record only first-configuration routing metadata; never URLs with query
  # strings, cookies, Access tokens, or request bodies.
  map $uri $trace_first_configuration {
    default 0;
    ~^/first-configuration 1;
  }
  log_format first_configuration_trace
    'time=$time_iso8601 peer=$remote_addr cf_client=$http_cf_connecting_ip '
    'xff="$http_x_forwarded_for" host=$host path=$uri status=$status';
  access_log /dev/stdout first_configuration_trace if=$trace_first_configuration;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;

  server {
    listen 127.0.0.1:8080;
    server_name _;
    location / {
      proxy_pass http://172.30.250.2:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Connection "";
    }
  }
}
