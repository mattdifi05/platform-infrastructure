worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_x_amz_content_sha256 $reject_unsigned_trailer {
        default 0;
        ~*STREAMING-UNSIGNED-PAYLOAD-TRAILER 1;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    server {
        listen 9000;
        if ($reject_unsigned_trailer) { return 400; }
        location / {
            set $backend rustfs-backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass http://$backend:9000;
        }
    }
    server {
        listen 9001;
        absolute_redirect off;
        location = / { return 302 /rustfs/console/; }
        if ($reject_unsigned_trailer) { return 400; }
        location / {
            set $backend rustfs-backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://$backend:9001;
        }
    }
}
