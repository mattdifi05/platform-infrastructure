# Single-VPS, prod-like overlay for VPS or another edge that terminates TLS.
# Public HTTPS stays at the provider/CDN; Traefik receives HTTP on port 80 and
# forwards X-Forwarded-Proto=https to application containers.

services:
  traefik:
    restart: always
    command: !override
      - --configFile=/etc/traefik/traefik.edge-http.yml
    ports: !override
      - "${TRAEFIK_HTTP_BIND:-80}:80"
    volumes: !override
      - ./traefik/traefik.edge-http.yml:/etc/traefik/traefik.edge-http.yml:ro
      - ./traefik/dynamic/middlewares.yml:/etc/traefik/dynamic/middlewares.yml:ro

  postgres:
    restart: always
    ports: !reset []

  redis:
    restart: always
    ports: !reset []

  keycloak:
    restart: always
    ports: !reset []
    labels: !reset []
    environment:
      KC_HOSTNAME: ${AUTH_HOST:-keycloak.local}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

  nats:
    restart: always
    ports: !reset []

  minio:
    restart: always
    ports: !reset []
    labels: !reset []

  mariadb:
    restart: always
    ports: !reset []
    environment: !override
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    secrets:
      - mariadb_root_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p\"$$(cat /run/secrets/mariadb_root_password)\" -N -e 'select 1' >/dev/null"]

  php-apache:
    restart: always
    depends_on: !override
      mariadb:
        condition: service_healthy

  project-router:
    restart: always

  control-center:
    restart: always
    environment:
      CONTROL_CENTER_AUTH_MODE: oidc-passkey
      CONTROL_CENTER_AUTH_STORE: postgres
      CONTROL_CENTER_DATABASE_LIVE_APPLY: ${CONTROL_CENTER_DATABASE_LIVE_APPLY:-true}

  phpmyadmin:
    profiles:
      - admin
    restart: "no"
    labels: !reset []

  phppgadmin:
    profiles:
      - admin
    restart: "no"
    labels: !reset []

  prometheus:
    restart: always
    ports: !reset []

  alertmanager:
    restart: always
    ports: !reset []

  platform-alert-dispatcher:
    restart: always

  grafana:
    restart: always
    ports: !reset []
    labels: !reset []

  loki:
    restart: always
    ports: !reset []

  promtail:
    restart: always

configs:
  enterprise_traefik_routes:
    content: |
      http:
        routers:
          enterprise-portal:
            rule: Host(`${CONTROL_CENTER_HOST:-${ADMIN_HOST:-portal.${DOMAIN:?Set DOMAIN}}}`)
            entryPoints:
              - web
            priority: 100
            middlewares:
              - enterprise-edge-forwarded-https@file
              - enterprise-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-portal

          enterprise-docs:
            rule: Host(`${DOCS_HOST:-docs.${DOMAIN:?Set DOMAIN}}`)
            entryPoints:
              - web
            priority: 100
            middlewares:
              - enterprise-edge-forwarded-https@file
              - enterprise-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-docs

          enterprise-identity:
            rule: Host(`${AUTH_HOST:-auth.${DOMAIN:?Set DOMAIN}}`)
            entryPoints:
              - web
            priority: 200
            middlewares:
              - enterprise-edge-forwarded-https@file
              - keycloak-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: enterprise-identity

        services:
          enterprise-portal:
            loadBalancer:
              servers:
                - url: http://control-center:8080
          enterprise-docs:
            loadBalancer:
              servers:
                - url: http://control-center:8080
          enterprise-identity:
            loadBalancer:
              servers:
                - url: http://keycloak:8080

secrets:
  mariadb_root_password:
    file: ${MARIADB_ROOT_PASSWORD_SECRET_FILE:-./secrets/mariadb_root_password.txt}
