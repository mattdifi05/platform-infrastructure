# Canonical LOCAL_PRIVATE workload overlay for the application topology that is
# active in V1.0. Application source remains in its owning repository; this
# platform repository owns only the deployment boundary and exact integration.
#
# This file intentionally contains no build directives. Build the four Stexor
# images with compose.local-private-applications-build.yaml before rendering
# this overlay. Load it after the canonical LOCAL_PRIVATE core overlays.

x-application-logging: &application_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-dedicated-php-app: &dedicated_php_app
  image: ${PHP_APACHE_IMAGE:-platform/php-apache:local}
  init: true
  pids_limit: 512
  logging: *application_logging
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  expose:
    - "80"
    - "443"
  environment: &dedicated_php_environment
    PROJECTS_GATEWAY_EMAIL: ${PROJECTS_GATEWAY_EMAIL:-admin@example.com}
    PROJECTS_GATEWAY_SIGNING_KEYS_FILE: /run/secrets/projects_gateway_signing_keys
    MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
    MAILER_REPLY_TO: ${MAILER_REPLY_TO:?Set MAILER_REPLY_TO}
    SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_SECURE: ${SMTP_SECURE:-true}
    SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
    SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    NODE_PROJECT_HOSTS: ${NODE_PROJECT_HOSTS:-}
    PROJECT_STATE_FILE: /var/www/project-state/projects.json
  secrets:
    - projects_gateway_signing_keys
    - smtp_password
  depends_on:
    mariadb:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "apache2ctl -t >/dev/null"]
    interval: 20s
    timeout: 5s
    retries: 10

x-stexor-node-app: &stexor_node_app
  image: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
  init: true
  pids_limit: 768
  logging: *application_logging
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  working_dir: /workspace
  command: ["sh", "/usr/local/bin/node-project-runtime"]
  expose:
    - "3000"
  environment: &stexor_node_environment
    PORT: "3000"
    HOST: "0.0.0.0"
    HOSTNAME: "0.0.0.0"
    NODE_ENV: production
    CI: "true"
    PROJECT_HOST_SUFFIX: ${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
    NEXT_TELEMETRY_DISABLED: "1"
    NODE_PROJECT_LOCK_NAME: stexor-web
    NODE_PROJECT_INSTALL_COMMAND: npm exec --yes pnpm@11.9.0 -- install --frozen-lockfile
    NODE_PROJECT_BUILD_COMMAND: npm exec --yes pnpm@11.9.0 -- --filter ./apps/web build
    NODE_PROJECT_START_COMMAND: NODE_ENV=production HOSTNAME=0.0.0.0 PORT=$$PORT exec node apps/web/.next/standalone/apps/web/server.js
  volumes:
    - ${PHP_PROJECTS_DIR:-../src}/stexor:/workspace
    - ./scripts/node-project-runtime.sh:/usr/local/bin/node-project-runtime:ro
  networks:
    - enterprise_net
    - platform_routing
    - platform_egress
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
    interval: 20s
    timeout: 5s
    retries: 20
    start_period: 180s

services:
  traefik:
    configs:
      - source: fresh_application_routes
        target: /etc/traefik/dynamic/fresh-application-routes.yml

  # Application ingress exists only with this workload overlay. Keep the
  # core-only greenfield render self-contained while attaching WAF whenever
  # the application topology is present.
  waf:
    networks:
      platform_ingress: {}

  backend:
    image: ${BACKEND_BUILD_IMAGE:-platform/backend:local}
    container_name: enterprise-backend
    init: true
    pids_limit: 512
    logging: *application_logging
    restart: always
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      SERVICE_NAME: enterprise-backend
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SESSION_SIGNING_KEYS_FILE: /run/secrets/session_signing_keys
      SECRET_HASH_KEYS_FILE: /run/secrets/hash_pepper_keys
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-app_session}
      SESSION_COOKIE_MAX_AGE_SECONDS: ${SESSION_COOKIE_MAX_AGE_SECONDS:-315360000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      APP_DB_NAME: ${APP_DB_NAME:-stexor}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: platform
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-platform}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-enterprise}
      NATS_URL_FILE: /run/secrets/nats_url
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-local-bucket}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.${DOMAIN:?Set DOMAIN}}
      ACCOUNT_PUBLIC_URL: ${ACCOUNT_PUBLIC_URL:-https://account.${DOMAIN:?Set DOMAIN}}
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-https://ui.${DOMAIN:?Set DOMAIN}}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-account.${DOMAIN:?Set DOMAIN}}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-https://account.${DOMAIN:?Set DOMAIN}}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://account.${DOMAIN:?Set DOMAIN},https://ui.${DOMAIN:?Set DOMAIN},https://portal.${DOMAIN:?Set DOMAIN}}
      BOT_PROTECTION_PROVIDER: ${BOT_PROTECTION_PROVIDER:-disabled}
      BOT_PROTECTION_REQUIRED: ${BOT_PROTECTION_REQUIRED:-}
      BOT_PROTECTION_EXPECTED_HOSTNAMES: ${BOT_PROTECTION_EXPECTED_HOSTNAMES:-account.${DOMAIN:?Set DOMAIN},ui.${DOMAIN:?Set DOMAIN},portal.${DOMAIN:?Set DOMAIN}}
      CLOUDFLARE_TURNSTILE_SECRET_KEY_FILE: /run/secrets/cloudflare_turnstile_secret_key
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      RATE_LIMIT_FALLBACK_MAX_REQUESTS: ${RATE_LIMIT_FALLBACK_MAX_REQUESTS:-80}
      SENSITIVE_ACTION_RATE_LIMIT_MAX: ${SENSITIVE_ACTION_RATE_LIMIT_MAX:-40}
      SENSITIVE_ACTION_FALLBACK_RATE_LIMIT_MAX: ${SENSITIVE_ACTION_FALLBACK_RATE_LIMIT_MAX:-10}
      SESSION_TOUCH_THROTTLE_SECONDS: ${SESSION_TOUCH_THROTTLE_SECONDS:-60}
      PASSKEY_CHALLENGE_TTL_SECONDS: ${PASSKEY_CHALLENGE_TTL_SECONDS:-300}
      OTP_SEND_COOLDOWN_SECONDS: ${OTP_SEND_COOLDOWN_SECONDS:-60}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      STRUCTURED_LOGGING: ${STRUCTURED_LOGGING:-true}
      MAILER_PROVIDER: ${MAILER_PROVIDER:-smtp}
      MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
      MAILER_REPLY_TO: ${MAILER_REPLY_TO:?Set MAILER_REPLY_TO}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      MAILER_CREDENTIALS_MANAGED_EXTERNALLY: ${MAILER_CREDENTIALS_MANAGED_EXTERNALLY:-true}
    secrets:
      - session_secret
      - session_signing_keys
      - hash_pepper_keys
      - database_url
      - redis_password
      - nats_url
      - minio_root_password
      - smtp_password
      - cloudflare_turnstile_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - enterprise_net
      - platform_routing
      - platform_postgres
      - platform_cache
      - platform_bus
      - platform_storage
      - platform_egress
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: ${WEB_BUILD_IMAGE:-platform/web:local}
    container_name: enterprise-web
    init: true
    pids_limit: 512
    logging: *application_logging
    restart: always
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.${DOMAIN:?Set DOMAIN}}
      NEXT_PUBLIC_UI_URL: ${NEXT_PUBLIC_UI_URL:-https://ui.${DOMAIN:?Set DOMAIN}}
      NEXT_PUBLIC_ACCOUNT_URL: ${NEXT_PUBLIC_ACCOUNT_URL:-https://account.${DOMAIN:?Set DOMAIN}}
      NEXT_PUBLIC_BOT_PROTECTION_PROVIDER: ${NEXT_PUBLIC_BOT_PROTECTION_PROVIDER:-disabled}
      NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
      INTERNAL_API_URL: http://backend:3000
      ACCOUNT_HOST: ${ACCOUNT_HOST:-account.${DOMAIN:?Set DOMAIN}}
      ACCOUNT_PUBLIC_URL: ${ACCOUNT_PUBLIC_URL:-https://account.${DOMAIN:?Set DOMAIN}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://account.${DOMAIN:?Set DOMAIN}}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.${DOMAIN:?Set DOMAIN}/realms/platform}
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - enterprise_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-notifications:
    image: ${WORKER_NOTIFICATIONS_BUILD_IMAGE:-platform/worker-notifications:local}
    container_name: enterprise-worker-notifications
    init: true
    pids_limit: 512
    logging: *application_logging
    restart: always
    command: ["sh", "-lc", "pnpm --filter $${WORKER_PACKAGE} start"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      WORKER_NAME: enterprise-worker-notifications
      ALERTMANAGER_WEBHOOK_TOKEN_FILE: /run/secrets/alertmanager_webhook_token
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: platform
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-platform}
      NATS_URL_FILE: /run/secrets/nats_url
      ALERT_FORWARD_WEBHOOK_URL: ${ALERT_FORWARD_WEBHOOK_URL:-}
      ALERT_DISCORD_WEBHOOK_URL_FILE: ${ALERT_DISCORD_WEBHOOK_URL_FILE:-}
      ALERT_TELEGRAM_BOT_TOKEN_FILE: ${ALERT_TELEGRAM_BOT_TOKEN_FILE:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_TELEGRAM_API_BASE_URL: ${ALERT_TELEGRAM_API_BASE_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@example.com}
      MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
      MAILER_REPLY_TO: ${MAILER_REPLY_TO:?Set MAILER_REPLY_TO}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      STRUCTURED_LOGGING: ${STRUCTURED_LOGGING:-true}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
    secrets:
      - alertmanager_webhook_token
      - database_url
      - redis_password
      - nats_url
      - smtp_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - enterprise_net
      - platform_postgres
      - platform_cache
      - platform_bus
      - platform_observability
      - platform_egress
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-jobs:
    image: ${WORKER_JOBS_BUILD_IMAGE:-platform/worker-jobs:local}
    container_name: enterprise-worker-jobs
    init: true
    pids_limit: 512
    logging: *application_logging
    restart: always
    command: ["sh", "-lc", "pnpm --filter $${WORKER_PACKAGE} start"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      WORKER_NAME: enterprise-worker-jobs
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: platform
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-platform}
      NATS_URL_FILE: /run/secrets/nats_url
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      STRUCTURED_LOGGING: ${STRUCTURED_LOGGING:-true}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      AUDIT_OUTBOX_ENABLED: ${AUDIT_OUTBOX_ENABLED:-true}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-25}
      AUDIT_OUTBOX_INTERVAL_MS: ${AUDIT_OUTBOX_INTERVAL_MS:-5000}
      AUDIT_OUTBOX_MAX_ATTEMPTS: ${AUDIT_OUTBOX_MAX_ATTEMPTS:-8}
      AUDIT_OUTBOX_LEASE_MS: ${AUDIT_OUTBOX_LEASE_MS:-60000}
      AUDIT_OUTBOX_INITIAL_BACKOFF_MS: ${AUDIT_OUTBOX_INITIAL_BACKOFF_MS:-5000}
      AUDIT_OUTBOX_BACKOFF_MULTIPLIER: ${AUDIT_OUTBOX_BACKOFF_MULTIPLIER:-2}
      AUDIT_OUTBOX_MAX_BACKOFF_MS: ${AUDIT_OUTBOX_MAX_BACKOFF_MS:-300000}
      AUDIT_OUTBOX_NATS_SUBJECT_PREFIX: ${AUDIT_OUTBOX_NATS_SUBJECT_PREFIX:-audit.events}
    secrets:
      - database_url
      - redis_password
      - nats_url
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - enterprise_net
      - platform_postgres
      - platform_cache
      - platform_bus
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  node-account:
    <<: *stexor_node_app
    container_name: node-account
    environment:
      <<: *stexor_node_environment
      ACCOUNT_HOST: account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      ACCOUNT_PUBLIC_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXTAUTH_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_ACCOUNT_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_API_URL: https://api${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_HOST: ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_PUBLIC_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_UI_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}

  node-ui:
    <<: *stexor_node_app
    container_name: node-ui
    environment:
      <<: *stexor_node_environment
      ACCOUNT_HOST: account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      ACCOUNT_PUBLIC_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXTAUTH_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_ACCOUNT_URL: https://account${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_API_URL: https://api${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_HOST: ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      UI_PUBLIC_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}
      NEXT_PUBLIC_UI_URL: https://ui${PROJECT_HOST_SUFFIX:-.platform-infrastructure.com}

  node-opstudents:
    image: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
    container_name: node-opstudents
    init: true
    pids_limit: 768
    logging: *application_logging
    restart: unless-stopped
    working_dir: /workspace
    command: ["sh", "/usr/local/bin/node-project-runtime"]
    expose:
      - "3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_PROJECT_LOCK_NAME: opstudents-next
      NODE_PROJECT_INSTALL_COMMAND: npm exec --yes pnpm@11.9.0 -- install --frozen-lockfile
      NODE_PROJECT_BUILD_COMMAND: npm exec --yes pnpm@11.9.0 -- build
      NODE_PROJECT_START_COMMAND: npm exec --yes pnpm@11.9.0 -- start
    volumes:
      - ${PHP_PROJECTS_DIR:-../src}/opstudents:/workspace
      - ${PHP_PROJECTS_DIR:-../src}/opstudents/scripts/node-project-runtime.sh:/usr/local/bin/node-project-runtime:ro
