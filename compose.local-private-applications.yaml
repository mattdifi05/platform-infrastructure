      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ${PLATFORM_STATE_DIR:?Set PLATFORM_STATE_DIR}:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ${PLATFORM_CERTS_DIR:?Set PLATFORM_CERTS_DIR}:/etc/apache2/certs:ro
    networks:
      - enterprise_net
      - platform_routing
      - platform_db_admin

  php-fiplatform:
    <<: *dedicated_php_app
    container_name: php-fiplatform
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/fiplatform:/var/www/projects/fiplatform
      - ${PHP_PROJECTS_DIR:-../src}/fiplatform:/var/www/projects/fireport
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ${PLATFORM_STATE_DIR:?Set PLATFORM_STATE_DIR}:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ${PLATFORM_CERTS_DIR:?Set PLATFORM_CERTS_DIR}:/etc/apache2/certs:ro
    networks:
      - enterprise_net
      - platform_routing
      - platform_db_admin

  php-matthewdifilippo:
    <<: *dedicated_php_app
    container_name: php-matthewdifilippo
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/matthewdifilippo:/var/www/projects/matthewdifilippo
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ${PLATFORM_STATE_DIR:?Set PLATFORM_STATE_DIR}:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ${PLATFORM_CERTS_DIR:?Set PLATFORM_CERTS_DIR}:/etc/apache2/certs:ro
    networks:
      - enterprise_net
      - platform_routing

  php-stream:
    <<: *dedicated_php_app
    container_name: php-stream
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/stream:/var/www/projects/stream
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ${PLATFORM_STATE_DIR:?Set PLATFORM_STATE_DIR}:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ${PLATFORM_CERTS_DIR:?Set PLATFORM_CERTS_DIR}:/etc/apache2/certs:ro
    networks:
      - enterprise_net
      - platform_routing
      - platform_db_admin
      - platform_egress

  php-workcalendar:
    <<: *dedicated_php_app
    container_name: php-workcalendar
    volumes:
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}/workcalendar:/var/www/projects/workcalendar
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ${PLATFORM_STATE_DIR:?Set PLATFORM_STATE_DIR}:/var/www/project-state
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available:ro
      - ${PLATFORM_CERTS_DIR:?Set PLATFORM_CERTS_DIR}:/etc/apache2/certs:ro
    networks:
      - enterprise_net
      - platform_routing
      - platform_db_admin

  # Direct-recovery start ordering only. The admitted Hosted package must
  # express this through its signed project-router platform extension.
  project-router:
    depends_on:
      node-account:
        condition: service_healthy
      node-opstudents:
        condition: service_healthy
      node-ui:
        condition: service_healthy
      php-anniversary:
        condition: service_healthy
      php-fiplatform:
        condition: service_healthy
      php-matthewdifilippo:
        condition: service_healthy
      php-stream:
        condition: service_healthy
      php-workcalendar:
        condition: service_healthy

  # The five dedicated PHP services above replace the broad legacy shared
  # runtime. The core deliberately leaves this service outside its protected
  # service set so a hosted overlay may disable it.
  php-apache:
    profiles:
      - legacy-shared-runtime-disabled
    restart: "no"

secrets:
  session_secret:
    file: ${PLATFORM_SECRETS_ROOT:?Set PLATFORM_SECRETS_ROOT}/session_secret.txt
  session_signing_keys:
    file: ${PLATFORM_SECRETS_ROOT:?Set PLATFORM_SECRETS_ROOT}/session_signing_keys.txt
  hash_pepper_keys:
    file: ${PLATFORM_SECRETS_ROOT:?Set PLATFORM_SECRETS_ROOT}/hash_pepper_keys.txt
  database_url:
    file: ${PLATFORM_SECRETS_ROOT:?Set PLATFORM_SECRETS_ROOT}/database_url.txt
  nats_url:
    file: ${PLATFORM_SECRETS_ROOT:?Set PLATFORM_SECRETS_ROOT}/nats_url.txt
  cloudflare_turnstile_secret_key:
    file: ${PLATFORM_SECRETS_ROOT:?Set PLATFORM_SECRETS_ROOT}/cloudflare_turnstile_secret_key.txt

configs:
  fresh_application_routes:
    content: |
      http:
        routers:
          fresh-application-api:
            rule: Host(`${API_HOST:-api.${DOMAIN:?Set DOMAIN}}`)
            entryPoints:
              - web
            priority: 200
            middlewares:
              - enterprise-edge-forwarded-https@file
              - enterprise-security-headers@file
              - enterprise-rate-limit@file
              - enterprise-compress@file
            service: fresh-application-api

        services:
          fresh-application-api:
            loadBalancer:
              servers:
                - url: http://backend:3000

networks:
  platform_ingress:
    name: ${PLATFORM_NETWORK_PREFIX:-platform_infra_vps}_ingress
    labels:
      com.platform.trust-zone: edge-ingress
