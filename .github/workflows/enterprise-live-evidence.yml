name: enterprise-live-evidence

on:
  workflow_dispatch:
    inputs:
      run_external_uptime:
        description: Validate provider-backed external uptime evidence
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_public_load:
        description: Run public Cloudflare edge load benchmark
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_cloudflare_access:
        description: Verify Cloudflare Access admin applications
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_final_gates:
        description: Run final gates and stage a complete bundle for independent approval
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  actions: read

jobs:
  production-live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: External uptime provider evidence
        if: inputs.run_external_uptime == 'true'
        env:
          EXTERNAL_UPTIME_PROVIDER_EVIDENCE_JSON: ${{ secrets.EXTERNAL_UPTIME_PROVIDER_EVIDENCE_JSON }}
          EXTERNAL_UPTIME_EVIDENCE_SIGNER_WORKFLOW: ${{ vars.EXTERNAL_UPTIME_EVIDENCE_SIGNER_WORKFLOW }}
          EXTERNAL_UPTIME_EVIDENCE_SOURCE_SHA: ${{ vars.EXTERNAL_UPTIME_EVIDENCE_SOURCE_SHA }}
          EXTERNAL_UPTIME_EVIDENCE_SOURCE_REF: ${{ vars.EXTERNAL_UPTIME_EVIDENCE_SOURCE_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$EXTERNAL_UPTIME_PROVIDER_EVIDENCE_JSON"
          mkdir -p .tmp
          printf '%s\n' "$EXTERNAL_UPTIME_PROVIDER_EVIDENCE_JSON" > .tmp/external-uptime-provider.production.json
          sh ./scripts/infra-ops.sh external-uptime-check \
            --providerEvidence .tmp/external-uptime-provider.production.json \
            --providerEvidenceAttestation online \
            --providerEvidenceRepository "${{ github.repository }}" \
            --providerEvidenceWorkflow "$EXTERNAL_UPTIME_EVIDENCE_SIGNER_WORKFLOW" \
            --providerEvidenceSourceDigest "$EXTERNAL_UPTIME_EVIDENCE_SOURCE_SHA" \
            --providerEvidenceSourceRef "$EXTERNAL_UPTIME_EVIDENCE_SOURCE_REF" \
            --validateProviderEvidenceOnly
          sh ./scripts/infra-ops.sh external-uptime-check \
            --providerEvidence .tmp/external-uptime-provider.production.json \
            --providerEvidenceAttestation online \
            --providerEvidenceRepository "${{ github.repository }}" \
            --providerEvidenceWorkflow "$EXTERNAL_UPTIME_EVIDENCE_SIGNER_WORKFLOW" \
            --providerEvidenceSourceDigest "$EXTERNAL_UPTIME_EVIDENCE_SOURCE_SHA" \
            --providerEvidenceSourceRef "$EXTERNAL_UPTIME_EVIDENCE_SOURCE_REF" \
            --requireProviderEvidence

      - name: Production Cloudflare edge load benchmark
        if: inputs.run_public_load == 'true'
        env:
          PUBLIC_API_HEALTH_URL: ${{ vars.PUBLIC_API_HEALTH_URL }}
          EDGE_PROVIDER_EVIDENCE_JSON: ${{ secrets.EDGE_PROVIDER_EVIDENCE_JSON }}
          EDGE_PROVIDER_EVIDENCE_SIGNER_WORKFLOW: ${{ vars.EDGE_PROVIDER_EVIDENCE_SIGNER_WORKFLOW }}
          EDGE_PROVIDER_EVIDENCE_SOURCE_SHA: ${{ vars.EDGE_PROVIDER_EVIDENCE_SOURCE_SHA }}
          EDGE_PROVIDER_EVIDENCE_SOURCE_REF: ${{ vars.EDGE_PROVIDER_EVIDENCE_SOURCE_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$PUBLIC_API_HEALTH_URL"
          test -n "$EDGE_PROVIDER_EVIDENCE_JSON"
          mkdir -p .tmp
          printf '%s\n' "$EDGE_PROVIDER_EVIDENCE_JSON" > .tmp/edge-provider-evidence.production.json
          sh ./scripts/infra-ops.sh load-benchmark \
            --profiles 50,100,500 \
            --url "$PUBLIC_API_HEALTH_URL" \
            --requirePublicTarget \
            --requireEdgeEvidence \
            --expectedEdgeProvider cloudflare \
            --edgeProviderEvidence .tmp/edge-provider-evidence.production.json \
            --edgeProviderEvidenceAttestation online \
            --edgeProviderEvidenceRepository "${{ github.repository }}" \
            --edgeProviderEvidenceWorkflow "$EDGE_PROVIDER_EVIDENCE_SIGNER_WORKFLOW" \
            --edgeProviderEvidenceSourceDigest "$EDGE_PROVIDER_EVIDENCE_SOURCE_SHA" \
            --edgeProviderEvidenceSourceRef "$EDGE_PROVIDER_EVIDENCE_SOURCE_REF"

      - name: Cloudflare Access admin verify
        if: inputs.run_cloudflare_access == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_ADMIN_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_MANIFEST_JSON }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_ACCESS_ADMIN_MANIFEST_JSON"
          mkdir -p .tmp
          printf '%s\n' "$CLOUDFLARE_ACCESS_ADMIN_MANIFEST_JSON" > .tmp/cloudflare-access-admin.production.json
          sh ./scripts/infra-ops.sh cloudflare-access-admin \
            --manifest .tmp/cloudflare-access-admin.production.json \
            --verifyRemote

      - name: Production go-no-go
        if: inputs.run_final_gates == 'true'
        run: sh ./scripts/infra-ops.sh production-go-no-go --enforce

      - name: Production readiness live
        if: inputs.run_final_gates == 'true'
        run: sh ./scripts/production-readiness-live.sh

      - name: Evidence bundle stage for independent owner approval
        if: inputs.run_final_gates == 'true'
        run: |
          sh ./scripts/infra-ops.sh evidence-bundle --noArchive
          set +e
          output=$(sh ./scripts/infra-ops.sh evidence-bundle-verify --requireComplete 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          report=$(ls -t reports/evidence-bundle-verify/evidence-bundle-verify-*.json | head -n 1)
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (p.status !== "external-pending" || p.issues.length !== 0 || p.externalPending.length === 0) process.exit(1)' "$report"

      - name: Upload live evidence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enterprise-live-evidence
          path: |
            reports/
            .tmp/evidence-bundles/
          if-no-files-found: error
          retention-days: 30
