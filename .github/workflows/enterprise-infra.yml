name: enterprise-infra

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact protected-main commit SHA approved for release
        required: true
        type: string
      release_attestation_run_id:
        description: Release-attestation workflow run containing the bound manifest and SBOM
        required: true
        type: string
      release_manifest_sha256:
        description: Owner-reviewed SHA256 of the attested release subject manifest
        required: true
        type: string

permissions:
  contents: read

env:
  EVIDENCE_REPORT_PHASE: candidate-ci

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Check shell scripts parse
        run: |
          for file in scripts/*.sh; do
            if head -n 1 "$file" | grep -q bash; then
              bash -n "$file"
            else
              sh -n "$file"
            fi
          done
      - name: Maintainability policy
        run: sh ./scripts/infra-ops.sh maintainability-hygiene
      - name: Infrastructure behavior tests
        run: sh ./scripts/infra-ops.sh testing-hygiene
      - name: Upload quality evidence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infra-ci-quality-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Prepare Compose fixtures
        run: |
          mkdir -p .tmp/optional-project-source secrets traefik/certs
          printf 'Infrastructure-only CI placeholder.\n' > .tmp/optional-project-source/.infra-only
          for name in postgres_superuser_password keycloak_db_password redis_password keycloak_admin_password nats_password minio_root_password grafana_admin_password projects_gateway_signing_keys control_center_vault_keys control_center_database_url smtp_password mariadb_root_password phpmyadmin_control_password alertmanager_webhook_token backup_signing_keys restic_password; do
            printf 'ci-placeholder-%s-00000000000000000000000000000000\n' "$name" > "secrets/$name.txt"
          done
          printf 'dummy-cert\n' > traefik/certs/local-cert.pem
          printf 'dummy-key\n' > traefik/certs/local-key.pem
          cp .env.example .env
          printf '\nPROJECT_SOURCE_DIR=./.tmp/optional-project-source\n' >> .env
          docker network create enterprise_net || true
          docker volume create enterprise_mariadb_data || true
      - name: Render local WAF compose
        run: |
          docker compose --env-file .env -p platform_ops_ci \
            -f compose.yaml -f compose.secrets.yaml -f compose.waf.yaml \
            config --quiet
      - name: Render VPS WAF compose
        run: |
          docker compose --env-file .env.vps.example -p platform_infra_vps_ci \
            -f compose.yaml -f compose.secrets.yaml -f compose.vps.yaml -f compose.waf.yaml \
            -f compose.vps-waf.yaml -f compose.backup-scheduler.yaml -f compose.runtime.yaml \
            -f compose.networks.yaml -f compose.runtime-isolation.yaml \
            --profile backup config --quiet
      - name: Render staging and backup compose
        run: |
          docker compose --env-file .env -p platform_infra_staging_ci \
            -f compose.yaml -f compose.secrets.yaml -f compose.waf.yaml -f compose.staging.yaml \
            config --quiet
          docker compose --env-file .env -p platform_ops_backup_ci \
            -f compose.yaml -f compose.secrets.yaml -f compose.backup-scheduler.yaml \
            --profile backup config --quiet
      - name: Network segmentation policy
        run: sh ./scripts/infra-ops.sh network-segmentation-check --envFile .env.vps.example
      - name: HA configuration check
        run: sh ./scripts/infra-ops.sh ha-config-check
      - name: Managed secrets preflight
        run: sh ./scripts/infra-ops.sh managed-secrets-preflight --noDocker
      - name: Compose healthcheck coverage
        run: sh ./scripts/infra-ops.sh compose-healthcheck-coverage
      - name: Functional health policy
        run: sh ./scripts/infra-ops.sh functional-health-check --noDocker
      - name: Backup scheduler dry run
        run: |
          docker build -f docker/ops.Dockerfile -t platform/ops:ci .
          docker run --rm \
            -e BACKUP_SCHEDULER_DRY_RUN=true \
            -e PLATFORM_INFRA_HOST_ROOT="${{ github.workspace }}" \
            -e PROJECT_SOURCE_HOST_ROOT="${{ github.workspace }}/.tmp/optional-project-source" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/infra:ro" \
            -v "${{ github.workspace }}/.tmp/optional-project-source:/project:ro" \
            --entrypoint sh platform/ops:ci /infra/scripts/backup-scheduler.sh
      - name: Upload Compose evidence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infra-ci-compose-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: GitHub Actions workflow lint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color .github/workflows/*.yml
      - name: Supply-chain lock and negative fixtures
        run: |
          node --test scripts/supply-chain-policy.test.mjs
          PLATFORM_OPS_USE_HOST_NODE=1 sh ./scripts/supply-chain-lock-check.sh
      - name: Build context and daemon isolation sandboxes
        run: |
          sh ./scripts/build-context-sandbox-test.sh
          sh ./scripts/build-daemon-isolation-sandbox-test.sh
          sh ./scripts/core-image-supply-chain-test.sh
          sh ./scripts/helper-image-supply-chain-test.sh
      - name: Secret scan
        run: sh ./scripts/infra-ops.sh secret-scan
      - name: Static security checks
        run: sh ./scripts/infra-ops.sh static-security-check --infraOnly
      - name: Hosted workload contract tests
        run: node --test scripts/hosted-workload-contract.test.mjs
      - name: Release artifact and admission policy tests
        run: |
          mkdir -p .tmp/ci-sbom
          cp .env.example .tmp/ci-release.env
          printf '%s\n' '{"releaseImages":[{"key":"PLATFORM_ALERT_DISPATCHER_IMAGE","image":"registry.example/platform/alert-dispatcher:ci@sha256:1111111111111111111111111111111111111111111111111111111111111111"}]}' > .tmp/ci-release-images.json
          printf '%s\n' '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > .tmp/ci-sbom/pnpm-sbom-ci.json
          sh ./scripts/infra-ops.sh release-artifact-gate --envFile .tmp/ci-release.env --imageManifest .tmp/ci-release-images.json --sbom .tmp/ci-sbom/pnpm-sbom-ci.json
          sh scripts/cloudflare-origin-lock-ufw-test.sh
          sh scripts/cloudflare-origin-lock-ufw-transaction-test.sh
          node scripts/release-trust.test.mjs
          node scripts/release-artifact-policy.test.mjs
          node scripts/buildkit-sbom-policy.test.mjs
          node scripts/release-registry-resolution.test.mjs
          node scripts/stable-json-artifact.test.mjs
          node scripts/release-subject-manifest.test.mjs
          node scripts/release-go-no-go-policy.test.mjs
          node scripts/deployment-admission-policy.test.mjs
          node scripts/deployment-receipt-policy.test.mjs
          node scripts/privileged-workflow-policy.test.mjs
          node scripts/ssh-host-key-policy.test.mjs
          sh scripts/ops-image-trust-test.sh
          sh scripts/cloudflare-origin-lock-ufw-test.sh
          sh scripts/release-compose-admission.test.sh
          sh scripts/deploy-vps-input-test.sh
          sh scripts/deploy-vps-order-test.sh
          sh scripts/vps-activation-sink-test.sh
      - name: Upload supply-chain evidence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infra-ci-supply-chain-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  enterprise-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - quality
      - compose
      - supply-chain
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download gate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: infra-ci-*-evidence
          path: reports
          merge-multiple: true
      - name: External uptime manifest dry run
        run: sh ./scripts/infra-ops.sh external-uptime-check --dryRun
      - name: Cloudflare Access admin dry run
        run: sh ./scripts/infra-ops.sh cloudflare-access-admin --manifest cloudflare/access-admin.example.json
      - name: Cloudflare from-zero dry run
        run: sh ./scripts/infra-ops.sh cloudflare-from-zero --manifest cloudflare/from-zero.example.json
      - name: GitHub branch protection policy dry run
        run: sh ./scripts/infra-ops.sh github-branch-protection --repo "${{ github.repository }}" --branch main --dryRun
      - name: GitHub environments policy dry run
        run: sh ./scripts/infra-ops.sh github-environments --repo "${{ github.repository }}" --dryRun
      - name: GitHub Actions runtime policy dry run
        run: sh ./scripts/infra-ops.sh github-actions-config --repo "${{ github.repository }}"
      - name: GitHub Actions run evidence plan
        run: sh ./scripts/infra-ops.sh github-actions-run-evidence --repo "${{ github.repository }}" --workflow enterprise-infra.yml --branch main --sha "${{ github.sha }}"
      - name: Rate limit evidence
        run: sh ./scripts/infra-ops.sh rate-limit-evidence
      - name: Audit log evidence
        run: sh ./scripts/infra-ops.sh audit-log-evidence
      - name: Retention evidence
        run: sh ./scripts/infra-ops.sh retention-evidence
      - name: Secret rotation evidence plan
        run: sh ./scripts/infra-ops.sh secret-rotation-evidence
      - name: DR readiness check
        run: sh ./scripts/infra-ops.sh dr-readiness-check
      - name: DR evidence summary
        run: sh ./scripts/infra-ops.sh dr-evidence
      - name: Off-site restore drill plan
        run: sh ./scripts/infra-ops.sh offsite-restore-drill-restic --planOnly
      - name: Release evidence plan
        run: sh ./scripts/infra-ops.sh release-evidence --planOnly
      - name: Alert evidence summary
        run: sh ./scripts/infra-ops.sh alert-evidence
      - name: Production go-no-go summary
        run: sh ./scripts/infra-ops.sh production-go-no-go
      - name: Pre go-live evidence report
        run: sh ./scripts/infra-ops.sh pre-go-live-evidence --infraOnly --repo "${{ github.repository }}" --allowFailures
      - name: Enterprise requirements traceability
        run: sh ./scripts/infra-ops.sh enterprise-requirements-check
      - name: Production readiness checklist
        run: sh ./scripts/infra-ops.sh enterprise-requirements-check --manifest governance/production-readiness.json
      - name: Production live proof gate rejects missing evidence
        run: |
          if sh ./scripts/infra-ops.sh enterprise-requirements-check --manifest governance/production-readiness.json --requireLiveProofs; then
            echo "Live proof gate passed without real production evidence." >&2
            exit 1
          fi
      - name: Repository coverage audit
        run: sh ./scripts/infra-ops.sh repo-coverage-check
      - name: Linux portability check
        run: sh ./scripts/infra-ops.sh linux-portability-check
      - name: Evidence bundle smoke
        run: sh ./scripts/infra-ops.sh evidence-bundle --phase candidate-ci --strict --noArchive
      - name: Evidence bundle integrity verify
        run: |
          set +e
          output=$(sh ./scripts/infra-ops.sh evidence-bundle-verify --phase candidate-ci --requireComplete 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          report=$(ls -t reports/evidence-bundle-verify/evidence-bundle-verify-*.json | head -n 1)
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (p.status !== "external-pending" || p.issues.length !== 0 || p.externalPending.length === 0) process.exit(1)' "$report"
      - name: Upload CI evidence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infra-ci-evidence
          path: |
            reports/
            .tmp/evidence-bundles/
          if-no-files-found: ignore
          retention-days: 30

  dast-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: enterprise-readiness
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: ${{ vars.DAST_TARGET }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Run ZAP baseline against staging
        env:
          DAST_TARGET: ${{ vars.DAST_TARGET }}
        run: |
          test -n "$DAST_TARGET"
          sh ./scripts/dast-zap-baseline.sh "$DAST_TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: zap-baseline
          path: security/dast/

  release-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: enterprise-readiness
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      release_sha: ${{ steps.bind.outputs.release_sha }}
      release_tree: ${{ steps.bind.outputs.release_tree }}
    steps:
      - name: Checkout exact protected-main candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind owner-approved commit and tree
        id: bind
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          case "$APPROVED_SHA" in *[!a-f0-9]*|'') exit 1 ;; esac
          test "${#APPROVED_SHA}" -eq 40
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          RELEASE_TREE="$(git rev-parse "${APPROVED_SHA}^{tree}")"
          printf 'release_sha=%s\n' "$APPROVED_SHA" >> "$GITHUB_OUTPUT"
          printf 'release_tree=%s\n' "$RELEASE_TREE" >> "$GITHUB_OUTPUT"
      - name: Download exact release-attestation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-sigstore-release-evidence
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ inputs.release_attestation_run_id }}
          github-token: ${{ github.token }}
      - name: Select one manifest, SBOM and registry evidence set
        id: artifacts
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          EXPECTED_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          case "$EXPECTED_MANIFEST_SHA256" in *[!a-f0-9]*|'') exit 1 ;; esac
          test "${#EXPECTED_MANIFEST_SHA256}" -eq 64
          mapfile -t manifests < <(find "$CANDIDATE_DIR" -type f -name 'release-subjects-*.json' -print)
          mapfile -t sboms < <(find "$CANDIDATE_DIR" -type f -name 'github-release-sbom-*.cdx.json' -print)
          mapfile -t buildkit_sboms < <(find "$CANDIDATE_DIR" -type f -name 'buildkit-sbom-*.spdx.json' -print)
          mapfile -t registry_descriptors < <(find "$CANDIDATE_DIR" -type f -name 'registry-descriptor-*.json' -print)
          mapfile -t registry_resolutions < <(find "$CANDIDATE_DIR" -type f -name 'registry-resolution-*.json' -print)
          test "${#manifests[@]}" -eq 1
          test "${#sboms[@]}" -eq 1
          test "${#buildkit_sboms[@]}" -eq 1
          test "${#registry_descriptors[@]}" -eq 1
          test "${#registry_resolutions[@]}" -eq 1
          test "$(sha256sum "${manifests[0]}" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(jq -r '.repository' "${manifests[0]}")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.commitSha' "${manifests[0]}")" = "$APPROVED_SHA"
          printf 'manifest=%s\n' "${manifests[0]}" >> "$GITHUB_OUTPUT"
          printf 'sbom=%s\n' "${sboms[0]}" >> "$GITHUB_OUTPUT"
          printf 'buildkit_sbom=%s\n' "${buildkit_sboms[0]}" >> "$GITHUB_OUTPUT"
          printf 'registry_descriptor=%s\n' "${registry_descriptors[0]}" >> "$GITHUB_OUTPUT"
          printf 'registry_resolution=%s\n' "${registry_resolutions[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify release subjects and require trusted deployment admission
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_MANIFEST: ${{ steps.artifacts.outputs.manifest }}
          RELEASE_SBOM: ${{ steps.artifacts.outputs.sbom }}
          BUILDKIT_SBOM: ${{ steps.artifacts.outputs.buildkit_sbom }}
          REGISTRY_DESCRIPTOR: ${{ steps.artifacts.outputs.registry_descriptor }}
          REGISTRY_RESOLUTION: ${{ steps.artifacts.outputs.registry_resolution }}
        run: |
          sh ./scripts/release-artifact-gate.sh \
            --imageManifest "$RELEASE_MANIFEST" \
            --sbom "$RELEASE_SBOM" \
            --buildkitSbom "$BUILDKIT_SBOM" \
            --registryDescriptor "$REGISTRY_DESCRIPTOR" \
            --registryResolution "$REGISTRY_RESOLUTION" \
            --releaseSha "$APPROVED_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --sourceRef refs/heads/main \
            --signerWorkflow "$GITHUB_REPOSITORY/.github/workflows/release-attestation.yml"
          echo "EXTERNAL-PENDING: no authenticated trusted deployment-receipt producer is configured." >&2
          exit 1
      - name: Upload artifact-verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-admission-candidate-${{ github.run_id }}
          path: reports/release/
          if-no-files-found: ignore
          retention-days: 30

  deploy-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - enterprise-readiness
      - release-admission
      - dast-zap
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true
    environment:
      name: production
    concurrency:
      group: infra-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_REMOTE: ${{ vars.DEPLOY_REMOTE }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_SSH_HOST_KEY"
          test -n "$DEPLOY_REMOTE"
          test -n "$DEPLOY_SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          node ./scripts/pinned-ssh-host-key.mjs render \
            --remote "$DEPLOY_REMOTE" \
            --port "$DEPLOY_SSH_PORT" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          node ./scripts/pinned-ssh-host-key.mjs verify \
            --remote "$DEPLOY_REMOTE" \
            --port "$DEPLOY_SSH_PORT" \
            --file ~/.ssh/known_hosts
      - name: Deploy to VPS
        env:
          DEPLOY_REMOTE: ${{ vars.DEPLOY_REMOTE }}
          DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_RELEASE_SHA: ${{ needs.release-admission.outputs.release_sha }}
          DEPLOY_RELEASE_TREE: ${{ needs.release-admission.outputs.release_tree }}
          DEPLOY_RUN_WAF_SMOKE: "1"
          DEPLOY_RUN_INFRA_HEALTH: "1"
          DEPLOY_RUN_PRODUCTION_PREFLIGHT: "1"
          DEPLOY_RUN_PRE_GO_LIVE: "1"
          DEPLOY_RUN_GO_NO_GO: "1"
          DEPLOY_PRE_GO_LIVE_PRODUCTION_PREFLIGHT: "1"
          DEPLOY_PRE_GO_LIVE_RESTORE_DRILL: "1"
          DEPLOY_PRE_GO_LIVE_OFFSITE_RESTORE_DRY_RUN: "1"
          DEPLOY_PRE_GO_LIVE_GITHUB_REMOTE: "1"
        run: sh ./scripts/deploy-vps.sh
