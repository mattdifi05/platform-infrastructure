name: enterprise-infra-run-evidence

on:
  workflow_run:
    workflows:
      - enterprise-infra
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  github-actions-run-evidence:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified infrastructure commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install SHA-pinned Compose renderer
        env:
          PLATFORM_TEST_DOCKER_COMPOSE_BIN: /tmp/platform-ci-docker-compose-v5.3.1
          PLATFORM_TEST_DOCKER_COMPOSE_SHA256: f9ebc6ebdb19d769b793c245a736caaeb198c62587f13b25c660c13b4987f959
        run: |
          install -d -m 700 "$HOME/.docker/cli-plugins"
          curl --fail --silent --show-error --location \
            --output "$PLATFORM_TEST_DOCKER_COMPOSE_BIN" \
            https://github.com/docker/compose/releases/download/v5.3.1/docker-compose-linux-x86_64
          printf '%s  %s\n' "$PLATFORM_TEST_DOCKER_COMPOSE_SHA256" "$PLATFORM_TEST_DOCKER_COMPOSE_BIN" | sha256sum -c -
          chmod 700 "$PLATFORM_TEST_DOCKER_COMPOSE_BIN"
          install -m 700 "$PLATFORM_TEST_DOCKER_COMPOSE_BIN" "$HOME/.docker/cli-plugins/docker-compose"
          compose_version=$(docker compose version --short)
          test "$compose_version" = 5.3.1

      - name: Verify completed enterprise infra run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p ../compose-source secrets traefik/certs
          printf 'Infrastructure-only CI placeholder.\n' > ../compose-source/.infra-only
          for name in postgres_superuser_password keycloak_db_password redis_password keycloak_admin_password nats_password minio_root_password grafana_admin_password projects_gateway_signing_keys control_center_vault_keys control_center_database_url smtp_password mariadb_root_password phpmyadmin_control_password alertmanager_webhook_token backup_signing_keys restic_password docker_action_runtime_intent_trust_key docker_action_backup_catalog docker_action_backup_job_execute docker_action_backup_prune_plan docker_action_backup_prune_apply docker_action_restore_drill_full docker_action_backup_offsite_sync docker_action_evidence_runtime_snapshot; do
            printf 'ci-placeholder-%s-00000000000000000000000000000000\n' "$name" > "secrets/$name.txt"
          done
          chmod 600 secrets/*.txt
          chmod 640 secrets/alertmanager_webhook_token.txt
          printf 'dummy-cert\n' > traefik/certs/local-cert.pem
          printf 'dummy-key\n' > traefik/certs/local-key.pem
          chmod 644 traefik/certs/local-cert.pem traefik/certs/local-key.pem
          install -m 0600 .env.vps.example .env
          for key in DOMAIN PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY PLATFORM_BACKUP_SCHEDULER_IMAGE_SHA256 ALERT_EMAIL_TO MAILER_FROM MAILER_REPLY_TO SMTP_HOST SMTP_USER; do
            sed -i -E "/^${key}=/d" .env
          done
          {
            printf '%s\n' 'DOMAIN=fixture.invalid'
            printf '%s\n' 'PROJECT_SOURCE_DIR=../compose-source'
            printf '%s\n' 'PHP_PROJECTS_DIR=../compose-source'
            printf '%s\n' 'DOCKER_ACTION_ACTIVATION_INBOX=/srv/platform/provider-activation/inbox'
            printf '%s\n' 'DOCKER_ACTION_RUNTIME_INTENT_FILE=/srv/platform/trust/runtime-intent.json'
            printf '%s\n' 'DOCKER_ACTION_ACTIVE_RECEIPT_FILE=/srv/platform/trust/active-receipt.json'
            printf '%s\n' 'DOCKER_ACTION_RUNTIME_INTENT_ID=intent.offline-compose-v2'
            printf '%s\n' 'DOCKER_ACTION_ACTIVE_RECEIPT_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            printf '%s\n' 'DOCKER_ACTION_COMBINED_RENDER_SHA256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
            printf '%s\n' 'PLATFORM_OPS_IMAGE=registry.example.invalid/platform/ops@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff'
            printf '%s\n' 'PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY=registry.example.invalid/platform/backup-scheduler'
            printf '%s\n' 'PLATFORM_BACKUP_SCHEDULER_IMAGE_SHA256=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee'
            printf '%s\n' 'PLATFORM_DOCKER_ACTION_BROKER_IMAGE_REPOSITORY=registry.example.invalid/platform/docker-action-broker'
            printf '%s\n' 'PLATFORM_DOCKER_ACTION_BROKER_IMAGE_SHA256=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'
            printf '%s\n' 'PLATFORM_PROVIDER_ACTIVATION_SIDECAR_IMAGE_REPOSITORY=registry.example.invalid/platform/provider-activation'
            printf '%s\n' 'PLATFORM_PROVIDER_ACTIVATION_SIDECAR_IMAGE_SHA256=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd'
            printf '%s\n' 'ALERT_EMAIL_TO=qa@fixture.invalid'
            printf '%s\n' 'MAILER_FROM=qa@fixture.invalid'
            printf '%s\n' 'MAILER_REPLY_TO=qa@fixture.invalid'
            printf '%s\n' 'SMTP_HOST=smtp.fixture.invalid'
            printf '%s\n' 'SMTP_USER=qa'
          } >> .env
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node ./scripts/infra-ops.mjs github-actions-run-evidence \
            --repo "${{ github.repository }}" \
            --envFile .env \
            --workflow enterprise-infra.yml \
            --branch "${{ github.event.workflow_run.head_branch }}" \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --verifyRemote

      - name: Upload GitHub Actions run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-actions-run-evidence
          path: reports/github-actions/
          if-no-files-found: error
          retention-days: 30
