name: enterprise-infra-run-evidence

on:
  workflow_run:
    workflows:
      - enterprise-infra
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  github-actions-run-evidence:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified infrastructure commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify completed enterprise infra run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node ./scripts/infra-ops.mjs github-actions-run-evidence \
            --repo "${{ github.repository }}" \
            --envFile .env.vps.example \
            --workflow enterprise-infra.yml \
            --branch "${{ github.event.workflow_run.head_branch }}" \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --verifyRemote

      - name: Upload GitHub Actions run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-actions-run-evidence
          path: reports/github-actions/
          if-no-files-found: error
          retention-days: 30
