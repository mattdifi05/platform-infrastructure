name: v1-install-only

on:
  workflow_dispatch:
    inputs:
      approved_candidate_sha:
        description: Exact protected-main V1 commit to install without activation
        required: true
        type: string
      approved_controller_sha:
        description: Exact protected-main controller commit approved for install-only contract validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true
    concurrency:
      group: infra-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact protected-main tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact protected-main candidate and controller approval
        env:
          APPROVED_CANDIDATE_SHA: ${{ inputs.approved_candidate_sha }}
          APPROVED_CONTROLLER_SHA: ${{ inputs.approved_controller_sha }}
        run: |
          set -eu
          test "$APPROVED_CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$APPROVED_CONTROLLER_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git update-ref refs/remotes/github/main "$GITHUB_SHA"
          test "$(git rev-parse --verify refs/remotes/github/main)" = "$GITHUB_SHA"
      - name: Validate V1 source and receipt contracts without deployment authority
        run: |
          set -eu
          python3 -m py_compile \
            scripts/v1-brownfield-bootstrap-bridge.py \
            scripts/v1-brownfield-install-consumer.py \
            scripts/v1-node-runtime-prerequisite.py \
            scripts/v1-local-private-control.py \
            scripts/v1-local-private-reconcile.py \
            scripts/v1-local-private-recovery-refresh.py \
            scripts/v1-local-private-evidence-producer.py
          node --check scripts/v1-brownfield-install-receipt.mjs
          node --check scripts/v1-local-private-control-receipt.mjs
          node --test --test-concurrency=1 \
            scripts/v1-brownfield-install-receipt.test.mjs \
            scripts/v1-brownfield-install-consumer.test.mjs \
            scripts/v1-brownfield-bootstrap-bridge.test.mjs \
            scripts/v1-node-runtime-prerequisite.test.mjs \
            scripts/v1-local-private-control.test.mjs \
            scripts/v1-local-private-reconcile.test.mjs \
            scripts/v1-local-private-reconcile.abort-superseded.test.mjs \
            scripts/v1-local-private-control.begin-retry-apply.test.mjs \
            scripts/v1-local-private-recovery-refresh.test.mjs \
            scripts/v1-local-private-evidence-producer.test.mjs
      - name: Stop before any remote mutation without the Mac-only recovery key
        run: |
          printf '%s\n' 'STOP 78 LOCAL_OPERATOR_ESCROW_REQUIRED: run the fixed V1 client on the authorized Mac.' >&2
          exit 78
