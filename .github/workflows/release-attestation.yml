name: release-attestation

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release name shown in the signed release manifest
        required: false
        type: string

permissions: {}

concurrency:
  group: release-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-sigstore-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      RELEASE_NAME: ${{ github.event.inputs.release_name || github.ref_name || github.sha }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install checksum-pinned GitHub attestation verifier
        run: sh ./scripts/install-gh-attestation-verifier.sh

      - name: Prepare GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "PHP_APACHE_IMAGE=ghcr.io/${owner}/platform-infrastructure-php-apache" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx attestation builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker-container

      - name: Build and push infra PHP Apache image
        id: php-apache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/php-apache.Dockerfile
          push: true
          sbom: true
          platforms: linux/amd64
          tags: |
            ${{ env.PHP_APACHE_IMAGE }}:${{ github.sha }}
            ${{ env.PHP_APACHE_IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=platform-infrastructure-php-apache

      - name: Attest infra PHP Apache image provenance
        id: attest-php-apache
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.PHP_APACHE_IMAGE }}
          subject-digest: ${{ steps.php-apache.outputs.digest }}
          push-to-registry: true

      - name: Resolve immutable registry platform and extract BuildKit SBOM
        env:
          PHP_APACHE_DIGEST: ${{ steps.php-apache.outputs.digest }}
        run: |
          mkdir -p reports/release
          SUBJECT="${PHP_APACHE_IMAGE}@${PHP_APACHE_DIGEST}"
          docker buildx imagetools inspect "$SUBJECT" --raw > "reports/release/registry-descriptor-${GITHUB_RUN_ID}.json"
          node ./scripts/release-registry-resolution.mjs \
            --image "$SUBJECT" \
            --descriptor "reports/release/registry-descriptor-${GITHUB_RUN_ID}.json" \
            --platform linux/amd64 \
            --receipt "reports/release/registry-resolution-${GITHUB_RUN_ID}.json"
          docker buildx imagetools inspect "$SUBJECT" --format '{{ json .SBOM }}' > "reports/release/buildkit-sbom-${GITHUB_RUN_ID}.spdx.json"
          test -s "reports/release/buildkit-sbom-${GITHUB_RUN_ID}.spdx.json"

      - name: Verify image provenance and generate bound release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_APACHE_DIGEST: ${{ steps.php-apache.outputs.digest }}
        run: |
          mkdir -p .tmp/release-attestation reports/release
          git archive \
            --format=tar \
            --output="reports/release/source-archive-${GITHUB_RUN_ID}.tar" \
            "${GITHUB_SHA}"
          test -s "reports/release/source-archive-${GITHUB_RUN_ID}.tar"
          RELEASE_SUBJECTS_SHA256="$(node ./scripts/release-subject-manifest.mjs \
            --image "PHP_APACHE_IMAGE=${PHP_APACHE_IMAGE}@${PHP_APACHE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --signerWorkflow "${GITHUB_REPOSITORY}/.github/workflows/release-attestation.yml" \
            --releaseName "${RELEASE_NAME}" \
            --workflowRunId "${GITHUB_RUN_ID}" \
            --workflowRunUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --buildkitSbom "reports/release/buildkit-sbom-${GITHUB_RUN_ID}.spdx.json" \
            --registryDescriptor "reports/release/registry-descriptor-${GITHUB_RUN_ID}.json" \
            --registryResolution "reports/release/registry-resolution-${GITHUB_RUN_ID}.json" \
            --platform linux/amd64 \
            --manifest "reports/release/release-subjects-${GITHUB_RUN_ID}.json" \
            --sbom "reports/release/github-release-sbom-${GITHUB_RUN_ID}.cdx.json")"
          printf 'RELEASE_SUBJECTS_SHA256=%s\n' "$RELEASE_SUBJECTS_SHA256" >> "$GITHUB_ENV"

      - name: Attest release subject manifest provenance
        id: attest-release-manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: reports/release/release-subjects-${{ github.run_id }}.json

      - name: Cryptographically verify and record attestations
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_APACHE_DIGEST: ${{ steps.php-apache.outputs.digest }}
        run: |
          node ./scripts/infra-ops.mjs github-attestation-evidence \
            --subject "reports/release/release-subjects-${GITHUB_RUN_ID}.json" \
            --expectedSubjectDigest "sha256:${RELEASE_SUBJECTS_SHA256}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signerWorkflow "${GITHUB_REPOSITORY}/.github/workflows/release-attestation.yml" \
            --sourceDigest "${GITHUB_SHA}" \
            --sourceRef "${GITHUB_REF}"
          node ./scripts/infra-ops.mjs release-artifact-gate \
            --imageManifest "reports/release/release-subjects-${GITHUB_RUN_ID}.json" \
            --sbom "reports/release/github-release-sbom-${GITHUB_RUN_ID}.cdx.json" \
            --sourceArchive "reports/release/source-archive-${GITHUB_RUN_ID}.tar" \
            --buildkitSbom "reports/release/buildkit-sbom-${GITHUB_RUN_ID}.spdx.json" \
            --registryDescriptor "reports/release/registry-descriptor-${GITHUB_RUN_ID}.json" \
            --registryResolution "reports/release/registry-resolution-${GITHUB_RUN_ID}.json" \
            --releaseSha "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sourceRef "${GITHUB_REF}" \
            --signerWorkflow "${GITHUB_REPOSITORY}/.github/workflows/release-attestation.yml" \
            --artifactVerificationOnly \
            --receiptOutput "reports/release/release-artifact-admission-${GITHUB_RUN_ID}.json"

      - name: Upload GitHub Sigstore release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-sigstore-release-evidence
          path: |
            reports/release/github-sigstore-attestation-*.json
            reports/release/github-sigstore-attestation-*.md
            reports/release/github-release-sbom-*.cdx.json
            reports/release/buildkit-sbom-*.spdx.json
            reports/release/registry-descriptor-*.json
            reports/release/registry-resolution-*.json
            reports/release/release-artifact-admission-*.json
            reports/release/release-subjects-*.json
            reports/release/source-archive-*.tar
          retention-days: 30
