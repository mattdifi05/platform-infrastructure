name: release-attestation

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release name shown in the signed release manifest
        required: false
        type: string

permissions: {}

concurrency:
  group: release-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-sigstore-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      RELEASE_NAME: ${{ github.event.inputs.release_name || github.ref_name || github.sha }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install checksum-pinned GitHub attestation verifier
        run: sh ./scripts/install-gh-attestation-verifier.sh

      - name: Prepare GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "CONTROL_CENTER_IMAGE=ghcr.io/${owner}/platform-infrastructure-control-center"
            echo "PROJECT_ROUTER_IMAGE=ghcr.io/${owner}/platform-infrastructure-project-router"
            echo "PLATFORM_ALERT_DISPATCHER_IMAGE=ghcr.io/${owner}/platform-infrastructure-alert-dispatcher"
            echo "PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY=ghcr.io/${owner}/platform-infrastructure-backup-scheduler"
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx attestation builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker-container

      - name: Build and push Control Center image
        id: control-center
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/control-center.Dockerfile
          push: true
          sbom: true
          platforms: linux/amd64
          tags: ${{ env.CONTROL_CENTER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=platform-infrastructure-control-center

      - name: Attest Control Center image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.CONTROL_CENTER_IMAGE }}
          subject-digest: ${{ steps.control-center.outputs.digest }}
          push-to-registry: true

      - name: Build and push Project Router image
        id: project-router
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/project-router.Dockerfile
          push: true
          sbom: true
          platforms: linux/amd64
          tags: ${{ env.PROJECT_ROUTER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=platform-infrastructure-project-router

      - name: Attest Project Router image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.PROJECT_ROUTER_IMAGE }}
          subject-digest: ${{ steps.project-router.outputs.digest }}
          push-to-registry: true

      - name: Build and push Alert Dispatcher image
        id: alert-dispatcher
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/alert-dispatcher.Dockerfile
          push: true
          sbom: true
          platforms: linux/amd64
          tags: ${{ env.PLATFORM_ALERT_DISPATCHER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=platform-infrastructure-alert-dispatcher

      - name: Attest Alert Dispatcher image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.PLATFORM_ALERT_DISPATCHER_IMAGE }}
          subject-digest: ${{ steps.alert-dispatcher.outputs.digest }}
          push-to-registry: true

      - name: Build and push Backup Scheduler image
        id: backup-scheduler
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backup-scheduler.Dockerfile
          push: true
          sbom: true
          platforms: linux/amd64
          tags: ${{ env.PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=platform-infrastructure-backup-scheduler

      - name: Attest Backup Scheduler image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.backup-scheduler.outputs.digest }}
          push-to-registry: true

      - name: Resolve immutable registry platform and extract BuildKit SBOM
        env:
          CONTROL_CENTER_DIGEST: ${{ steps.control-center.outputs.digest }}
          PROJECT_ROUTER_DIGEST: ${{ steps.project-router.outputs.digest }}
          PLATFORM_ALERT_DISPATCHER_DIGEST: ${{ steps.alert-dispatcher.outputs.digest }}
          PLATFORM_BACKUP_SCHEDULER_DIGEST: ${{ steps.backup-scheduler.outputs.digest }}
        run: |
          mkdir -p reports/release
          while IFS='|' read -r key image digest; do
            test -n "$key" && test -n "$image" && test -n "$digest"
            subject="${image}@${digest}"
            descriptor="reports/release/registry-descriptor-${key}-${GITHUB_RUN_ID}.json"
            resolution="reports/release/registry-resolution-${key}-${GITHUB_RUN_ID}.json"
            buildkit="reports/release/buildkit-sbom-${key}-${GITHUB_RUN_ID}.spdx.json"
            platform_manifest="reports/release/platform-manifest-${key}-${GITHUB_RUN_ID}-linux-amd64.json"
            docker buildx imagetools inspect "$subject" --raw > "$descriptor"
            platform_digest="$(node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const m=(d.manifests||[]).filter(x=>x&&x.platform&&x.platform.os==="linux"&&x.platform.architecture==="amd64");if(m.length!==1||!/^sha256:[a-f0-9]{64}$/.test(String(m[0].digest||"")))process.exit(1);process.stdout.write(m[0].digest)' "$descriptor")"
            docker buildx imagetools inspect "${image}@${platform_digest}" --raw > "$platform_manifest"
            test -s "$platform_manifest"
            node ./scripts/release-registry-resolution.mjs \
              --image "$subject" \
              --descriptor "$descriptor" \
              --platform linux/amd64 \
              --platformManifest "linux/amd64=$platform_manifest" \
              --receipt "$resolution"
            docker buildx imagetools inspect "$subject" --format '{{ json .SBOM }}' > "$buildkit"
            test -s "$buildkit"
          done <<EOF
          CONTROL_CENTER_IMAGE|${CONTROL_CENTER_IMAGE}|${CONTROL_CENTER_DIGEST}
          PLATFORM_BACKUP_SCHEDULER_IMAGE|${PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY}|${PLATFORM_BACKUP_SCHEDULER_DIGEST}
          PLATFORM_ALERT_DISPATCHER_IMAGE|${PLATFORM_ALERT_DISPATCHER_IMAGE}|${PLATFORM_ALERT_DISPATCHER_DIGEST}
          PROJECT_ROUTER_IMAGE|${PROJECT_ROUTER_IMAGE}|${PROJECT_ROUTER_DIGEST}
          EOF

      - name: Verify image provenance and generate bound release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_CENTER_DIGEST: ${{ steps.control-center.outputs.digest }}
          PROJECT_ROUTER_DIGEST: ${{ steps.project-router.outputs.digest }}
          PLATFORM_ALERT_DISPATCHER_DIGEST: ${{ steps.alert-dispatcher.outputs.digest }}
          PLATFORM_BACKUP_SCHEDULER_DIGEST: ${{ steps.backup-scheduler.outputs.digest }}
        run: |
          mkdir -p .tmp/release-attestation reports/release
          git -c tar.umask=0000 archive \
            --format=tar \
            --output="reports/release/source-archive-${GITHUB_RUN_ID}.tar" \
            "${GITHUB_SHA}"
          test -s "reports/release/source-archive-${GITHUB_RUN_ID}.tar"
          RELEASE_SUBJECTS_SHA256="$(node ./scripts/release-subject-manifest.mjs \
            --image "CONTROL_CENTER_IMAGE=${CONTROL_CENTER_IMAGE}@${CONTROL_CENTER_DIGEST}" \
            --image "PLATFORM_BACKUP_SCHEDULER_IMAGE=${PLATFORM_BACKUP_SCHEDULER_IMAGE_REPOSITORY}@${PLATFORM_BACKUP_SCHEDULER_DIGEST}" \
            --image "PROJECT_ROUTER_IMAGE=${PROJECT_ROUTER_IMAGE}@${PROJECT_ROUTER_DIGEST}" \
            --image "PLATFORM_ALERT_DISPATCHER_IMAGE=${PLATFORM_ALERT_DISPATCHER_IMAGE}@${PLATFORM_ALERT_DISPATCHER_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --signerWorkflow "${GITHUB_REPOSITORY}/.github/workflows/release-attestation.yml" \
            --releaseName "${RELEASE_NAME}" \
            --workflowRunId "${GITHUB_RUN_ID}" \
            --workflowRunUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --buildkitSbom "CONTROL_CENTER_IMAGE=reports/release/buildkit-sbom-CONTROL_CENTER_IMAGE-${GITHUB_RUN_ID}.spdx.json" \
            --buildkitSbom "PLATFORM_BACKUP_SCHEDULER_IMAGE=reports/release/buildkit-sbom-PLATFORM_BACKUP_SCHEDULER_IMAGE-${GITHUB_RUN_ID}.spdx.json" \
            --buildkitSbom "PLATFORM_ALERT_DISPATCHER_IMAGE=reports/release/buildkit-sbom-PLATFORM_ALERT_DISPATCHER_IMAGE-${GITHUB_RUN_ID}.spdx.json" \
            --buildkitSbom "PROJECT_ROUTER_IMAGE=reports/release/buildkit-sbom-PROJECT_ROUTER_IMAGE-${GITHUB_RUN_ID}.spdx.json" \
            --registryDescriptor "CONTROL_CENTER_IMAGE=reports/release/registry-descriptor-CONTROL_CENTER_IMAGE-${GITHUB_RUN_ID}.json" \
            --registryDescriptor "PLATFORM_BACKUP_SCHEDULER_IMAGE=reports/release/registry-descriptor-PLATFORM_BACKUP_SCHEDULER_IMAGE-${GITHUB_RUN_ID}.json" \
            --registryDescriptor "PLATFORM_ALERT_DISPATCHER_IMAGE=reports/release/registry-descriptor-PLATFORM_ALERT_DISPATCHER_IMAGE-${GITHUB_RUN_ID}.json" \
            --registryDescriptor "PROJECT_ROUTER_IMAGE=reports/release/registry-descriptor-PROJECT_ROUTER_IMAGE-${GITHUB_RUN_ID}.json" \
            --registryResolution "CONTROL_CENTER_IMAGE=reports/release/registry-resolution-CONTROL_CENTER_IMAGE-${GITHUB_RUN_ID}.json" \
            --registryResolution "PLATFORM_BACKUP_SCHEDULER_IMAGE=reports/release/registry-resolution-PLATFORM_BACKUP_SCHEDULER_IMAGE-${GITHUB_RUN_ID}.json" \
            --registryResolution "PLATFORM_ALERT_DISPATCHER_IMAGE=reports/release/registry-resolution-PLATFORM_ALERT_DISPATCHER_IMAGE-${GITHUB_RUN_ID}.json" \
            --registryResolution "PROJECT_ROUTER_IMAGE=reports/release/registry-resolution-PROJECT_ROUTER_IMAGE-${GITHUB_RUN_ID}.json" \
            --evidenceBundle "reports/release/release-subject-evidence-${GITHUB_RUN_ID}.json" \
            --platform linux/amd64 \
            --manifest "reports/release/release-subjects-${GITHUB_RUN_ID}.json" \
            --sbom "reports/release/github-release-sbom-${GITHUB_RUN_ID}.cdx.json")"
          printf 'RELEASE_SUBJECTS_SHA256=%s\n' "$RELEASE_SUBJECTS_SHA256" >> "$GITHUB_ENV"

      - name: Attest release subject manifest provenance
        id: attest-release-manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: reports/release/release-subjects-${{ github.run_id }}.json

      - name: Cryptographically verify and record attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ./scripts/infra-ops.mjs github-attestation-evidence \
            --subject "reports/release/release-subjects-${GITHUB_RUN_ID}.json" \
            --expectedSubjectDigest "sha256:${RELEASE_SUBJECTS_SHA256}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signerWorkflow "${GITHUB_REPOSITORY}/.github/workflows/release-attestation.yml" \
            --sourceDigest "${GITHUB_SHA}" \
            --sourceRef "${GITHUB_REF}"
          node ./scripts/infra-ops.mjs release-artifact-gate \
            --imageManifest "reports/release/release-subjects-${GITHUB_RUN_ID}.json" \
            --sbom "reports/release/github-release-sbom-${GITHUB_RUN_ID}.cdx.json" \
            --sourceArchive "reports/release/source-archive-${GITHUB_RUN_ID}.tar" \
            --subjectEvidenceBundle "reports/release/release-subject-evidence-${GITHUB_RUN_ID}.json" \
            --releaseSha "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sourceRef "${GITHUB_REF}" \
            --signerWorkflow "${GITHUB_REPOSITORY}/.github/workflows/release-attestation.yml" \
            --artifactVerificationOnly \
            --receiptOutput "reports/release/release-artifact-admission-${GITHUB_RUN_ID}.json"

      - name: Upload GitHub Sigstore release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-sigstore-release-evidence
          path: |
            reports/release/github-sigstore-attestation-*.json
            reports/release/github-sigstore-attestation-*.md
            reports/release/github-release-sbom-*.cdx.json
            reports/release/buildkit-sbom-*.spdx.json
            reports/release/registry-descriptor-*.json
            reports/release/registry-resolution-*.json
            reports/release/release-subject-evidence-*.json
            reports/release/release-artifact-admission-*.json
            reports/release/release-subjects-*.json
            reports/release/source-archive-*.tar
          retention-days: 30
