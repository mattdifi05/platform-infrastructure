name: enterprise-vps-evidence

on:
  workflow_dispatch:
    inputs:
      run_bootstrap:
        description: Apply VPS bootstrap on the remote host
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_hardening:
        description: Apply VPS hardening on the remote host
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      reload_sshd:
        description: Reload SSH after hardening
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      replace_docker_daemon_config:
        description: Replace Docker daemon config after review
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      confirm_mutating_vps:
        description: Required true when bootstrap or hardening is enabled
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_user:
        description: Optional deploy user for bootstrap
        required: false
        type: string

permissions:
  contents: read

jobs:
  vps-host-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run VPS evidence on VPS
        env:
          DEPLOY_REMOTE: ${{ vars.DEPLOY_REMOTE }}
          DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          VPS_HARDENED_SSH_PORT: ${{ vars.VPS_HARDENED_SSH_PORT }}
          RUN_BOOTSTRAP: ${{ inputs.run_bootstrap }}
          RUN_HARDENING: ${{ inputs.run_hardening }}
          RELOAD_SSHD: ${{ inputs.reload_sshd }}
          REPLACE_DOCKER_DAEMON_CONFIG: ${{ inputs.replace_docker_daemon_config }}
          CONFIRM_MUTATING_VPS: ${{ inputs.confirm_mutating_vps }}
          DEPLOY_USER: ${{ inputs.deploy_user }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_REMOTE"
          test -n "$DEPLOY_REMOTE_DIR"
          test -n "$DEPLOY_SSH_PORT"
          test -n "$VPS_HARDENED_SSH_PORT"
          test "$WORKFLOW_SHA" = "$(git rev-parse --verify HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          workflow_tree=$(git rev-parse --verify "$WORKFLOW_SHA^{tree}")
          test -n "$workflow_tree"
          if { [ "$RUN_BOOTSTRAP" = "true" ] || [ "$RUN_HARDENING" = "true" ]; } && [ "$CONFIRM_MUTATING_VPS" != "true" ]; then
            echo "Set confirm_mutating_vps=true before enabling VPS bootstrap or hardening." >&2
            exit 1
          fi
          install -d .tmp
          remote_output=".tmp/vps-evidence-remote-output.txt"
          WORKFLOW_TREE="$workflow_tree" node ./scripts/vps-evidence-request.mjs render > .tmp/vps-evidence-remote.sh
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_REMOTE" 'bash -s' < .tmp/vps-evidence-remote.sh > "$remote_output"
          sed -n '/^__PLATFORM_VPS_EVIDENCE_RECEIPT_BEGIN__$/,/^__PLATFORM_VPS_EVIDENCE_RECEIPT_END__$/p' "$remote_output" \
            | sed '1d;$d' > .tmp/vps-evidence-receipt.json.b64
          sed -n '/^__PLATFORM_VPS_EVIDENCE_TGZ_BEGIN__$/,/^__PLATFORM_VPS_EVIDENCE_TGZ_END__$/p' "$remote_output" \
            | sed '1d;$d' > .tmp/vps-evidence.tgz.b64
          test -s .tmp/vps-evidence-receipt.json.b64
          test -s .tmp/vps-evidence.tgz.b64
          base64 -d .tmp/vps-evidence-receipt.json.b64 > .tmp/vps-evidence-receipt.json
          base64 -d .tmp/vps-evidence.tgz.b64 > .tmp/vps-evidence.tgz
          tar -tzf .tmp/vps-evidence.tgz > .tmp/vps-evidence.entries
          node ./scripts/vps-evidence-request.mjs verify-receipt \
            --receipt .tmp/vps-evidence-receipt.json \
            --archive .tmp/vps-evidence.tgz \
            --entries .tmp/vps-evidence.entries \
            --expectedSha "$WORKFLOW_SHA" \
            --expectedTree "$workflow_tree" \
            > .tmp/vps-evidence-provenance.json
          tar --extract --gzip --file .tmp/vps-evidence.tgz --no-same-owner --no-same-permissions

      - name: Upload VPS evidence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enterprise-vps-evidence
          path: |
            reports/vps-bootstrap/
            reports/vps-hardening/
            reports/vps-host/
            .tmp/vps-evidence-remote-output.txt
            .tmp/vps-evidence-receipt.json
            .tmp/vps-evidence-provenance.json
            .tmp/vps-evidence.entries
          if-no-files-found: error
          retention-days: 30
