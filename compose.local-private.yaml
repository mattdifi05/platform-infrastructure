# V1 LOCAL_PRIVATE filesystem/setup overlay. Load after every canonical
# runtime overlay so immutable release sources stay read-only while mutable
# state, TLS material and the runtime secret store remain deployment-owned.
# Deployment values for PLATFORM_STATE_DIR, PLATFORM_CERTS_DIR,
# PLATFORM_SECRETS_ROOT and CONTROL_CENTER_LOCAL_CA_CERT_SOURCE must be
# absolute paths outside the release tree.
# LOCAL_PRIVATE keeps Docker authority in a fixed-action broker. The scheduler
# remains free of docker.sock and can request only signed catalog, typed-job and
# off-site sync actions through the broker UDS.
services:
  waf:
    group_add: !override
      - ${WAF_TLS_KEY_GID:?set WAF_TLS_KEY_GID}
    volumes: !override
      - ./waf/REQUEST-900-VPS-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./waf/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      - ${PLATFORM_CERTS_DIR:?set PLATFORM_CERTS_DIR}/local-cert.pem:/etc/nginx/conf/server.crt:ro
      - ${PLATFORM_CERTS_DIR:?set PLATFORM_CERTS_DIR}/local-key.pem:/etc/nginx/conf/server.key:ro

  php-apache:
    volumes: !override
      - ${PHP_SOURCE_DIR:-./php-runtime-root}:/var/www/html
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects
      - ${PROJECTS_SYMLINK_TARGET_ROOT:-..}:/mnt/host/d/docker:ro
      - ./php-apache/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php-apache/apache:/etc/apache2/sites-available
      - ${PLATFORM_CERTS_DIR:?set PLATFORM_CERTS_DIR}:/etc/apache2/certs:ro

  control-center:
    environment:
      CONTROL_CENTER_ENV: local_private
      CONTROL_CENTER_FIRST_CONFIGURATION_MODE: required
      CONTROL_CENTER_FIRST_CONFIGURATION_ADMIN_USERNAME: ${CONTROL_CENTER_FIRST_CONFIGURATION_ADMIN_USERNAME:-admin}
      CONTROL_CENTER_FIRST_CONFIGURATION_ADMIN_EMAIL: ${CONTROL_CENTER_FIRST_CONFIGURATION_ADMIN_EMAIL:-${PROJECTS_GATEWAY_EMAIL:-admin@example.com}}
      CONTROL_CENTER_FIRST_CONFIGURATION_ALLOWED_CIDRS: ${CONTROL_CENTER_FIRST_CONFIGURATION_ALLOWED_CIDRS:-192.168.1.0/24,127.0.0.0/8,::1/128}
      CONTROL_CENTER_FIRST_CONFIGURATION_TRUSTED_PROXY_CIDRS: ${CONTROL_CENTER_FIRST_CONFIGURATION_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,127.0.0.0/8,::1/128}
      CONTROL_CENTER_PASSKEY_TTL_SECONDS: ${CONTROL_CENTER_PASSKEY_TTL_SECONDS:-315360000}
      CONTROL_CENTER_DIRECT_APPLICATION_BACKUPS: ${CONTROL_CENTER_DIRECT_APPLICATION_BACKUPS:-true}
      CONTROL_CENTER_BACKUP_ROOT: /var/www/project-state/backups
      CONTROL_CENTER_REPORTS_ROOT: /var/www/project-state/reports
      CONTROL_CENTER_DOCKER_STATS_MAX_AGE_SECONDS: "30"
      CONTROL_CENTER_REDIS_LIVE_APPLY: "true"
      NODE_EXTRA_CA_CERTS: /run/platform/tls/control-center-local-ca.pem
    volumes: !override
      - .:/var/www/infra-docs:ro
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects:ro
      - ${PLATFORM_STATE_DIR:?set PLATFORM_STATE_DIR}:/var/www/project-state
      - ${CONTROL_CENTER_LOCAL_CA_CERT_SOURCE:?set CONTROL_CENTER_LOCAL_CA_CERT_SOURCE}:/run/platform/tls/control-center-local-ca.pem:ro
      - ${HOSTED_WORKLOAD_RUNTIME_LOCK_SOURCE:?set exact LOCAL_PRIVATE runtime lock}:/run/platform/hosted-workloads.lock.json:ro
  project-router:
    environment:
      PROJECT_ROUTER_LOCAL_PRIVATE_COMPATIBILITY_MODE: "true"
      PROJECT_ROUTER_WORKLOAD_LOCK_SHA256: 22179b2b1eef155b22f7d1d6d54069f6b2891cff5fce5e352a2d445048926ed7
      PROJECT_HOST_SUFFIX: .platform-infrastructure.com
      PROJECT_ROUTER_ALLOWED_UPSTREAMS: control-center:8080,node-account:3000,node-opstudents:3000,node-ui:3000,php-anniversary:80,php-fiplatform:80,php-matthewdifilippo:80,php-stream:80,php-workcalendar:80
      NODE_PROJECT_HOSTS: ""
      PROJECT_UPSTREAMS: ""
      STATIC_PROJECT_UPSTREAMS: ""
      NODE_PROJECT_UPSTREAMS: account=http://node-account:3000,opstudents=http://node-opstudents:3000,ui=http://node-ui:3000
      PHP_PROJECT_UPSTREAMS: anniversary=http://php-anniversary:80,fiplatform=http://php-fiplatform:80,fireport=http://php-fiplatform:80,matthewdifilippo=http://php-matthewdifilippo:80,stream=http://php-stream:80,workcalendar=http://php-workcalendar:80
    volumes: !override
      - ${PHP_PROJECTS_DIR:-../src}:/var/www/projects:ro
      - ${HOSTED_WORKLOAD_RUNTIME_LOCK_SOURCE:?set exact LOCAL_PRIVATE runtime lock}:/run/platform/hosted-workloads.lock.json:ro

  mariadb:
    networks: !override
      platform_db_admin:
        aliases:
          - platform.local
    volumes: !override
      - enterprise_mariadb_data:/var/lib/mysql
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ${PLATFORM_CERTS_DIR:?set PLATFORM_CERTS_DIR}:/etc/mysql/ssl:ro

  phpmyadmin:
    profiles: !override
      - admin
    pids_limit: 256
    restart: unless-stopped
    environment: !override
      PMA_HOST: platform.local
      PMA_PORT: 3306
      PMA_SSL_CA: /etc/phpmyadmin/certs/ca.pem
      PMA_SSL_VERIFIES: "1"
      UPLOAD_LIMIT: 256M
    secrets: !reset []
    volumes: !override
      - ./phpmyadmin/apache-forwarded-proto.conf:/etc/apache2/conf-enabled/forwarded-proto.conf:ro
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
      - ${PLATFORM_CERTS_DIR:?set PLATFORM_CERTS_DIR}:/etc/phpmyadmin/certs:ro

  phppgadmin:
    profiles: !override
      - admin
    pids_limit: 256
    restart: unless-stopped

  node-exporter:
    profiles: !reset []
    volumes: !override
      - /:/host:ro
      - ${LOCAL_PRIVATE_BACKUP_DATA_DIR:?set dedicated backup data directory}/runtime-state/node-exporter-textfile:/var/lib/node-exporter/textfile:ro

secrets:
  phpmyadmin_control_password: !reset null
  backup_signing_keys:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/backup_signing_keys.txt
  alertmanager_webhook_token:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/alertmanager_webhook_token.txt
  control_center_database_url:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/control_center_database_url.txt
  control_center_vault_keys:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/control_center_vault_keys.txt
  docker_action_backup_catalog:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_backup_catalog.txt
  docker_action_backup_job_execute:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_backup_job_execute.txt
  docker_action_backup_offsite_sync:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_backup_offsite_sync.txt
  docker_action_backup_prune_apply:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_backup_prune_apply.txt
  docker_action_backup_prune_plan:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_backup_prune_plan.txt
  docker_action_evidence_runtime_snapshot:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_evidence_runtime_snapshot.txt
  docker_action_restore_drill_full:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_restore_drill_full.txt
  docker_action_runtime_intent_trust_key:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/docker_action_runtime_intent_trust_key.txt
  grafana_admin_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/grafana_admin_password.txt
  keycloak_admin_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/keycloak_admin_password.txt
  keycloak_db_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/keycloak_db_password.txt
  mariadb_root_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/mariadb_root_password.txt
  minio_root_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/minio_root_password.txt
  nats_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/nats_password.txt
  postgres_superuser_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/postgres_superuser_password.txt
  projects_gateway_signing_keys:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/projects_gateway_signing_keys.txt
  redis_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/redis_password.txt
  smtp_password:
    file: ${PLATFORM_SECRETS_ROOT:?set PLATFORM_SECRETS_ROOT}/smtp_password.txt
