# Fresh VPS database images built from the repository's remediated Dockerfiles.
# Pulling tagged images is forbidden: the local build is checked by the
# installation/upgrade script before the Compose project is changed.
services:
  postgres:
    image: platform/postgres:18.6-remediated
    pull_policy: never

  mariadb:
    image: platform/mariadb:13.0.2-remediated
    pull_policy: never
