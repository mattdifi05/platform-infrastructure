services:
  backup-scheduler:
    image: ${PLATFORM_OPS_IMAGE:-platform/ops:local}
    build:
      context: .
      dockerfile: docker/ops.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
    container_name: enterprise-backup-scheduler
    profiles:
      - backup
    init: true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    entrypoint:
      - sh
      - /infra/scripts/backup-scheduler.sh
    environment:
      PLATFORM_INFRA_ROOT: /infra
      PLATFORM_INFRA_CONTAINER_ROOT: /infra
      PLATFORM_INFRA_HOST_ROOT: ${PLATFORM_INFRA_HOST_ROOT:-}
      PROJECT_SOURCE_ROOT: /project
      PROJECT_SOURCE_HOST_ROOT: ${PROJECT_SOURCE_HOST_ROOT:-}
      PROJECT_STATE_ROOT: /var/www/project-state
      PROJECT_DATABASES_FILE: /var/www/project-state/databases.json
      NODE_IMAGE: ${NODE_IMAGE:-node:26.3.1-alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606}
      BACKUP_SCHEDULER_CATALOG_CRON: "${BACKUP_SCHEDULER_CATALOG_CRON:-5 */8 * * *}"
      BACKUP_SCHEDULER_FULL_RESTORE_DRILL_AT: ${BACKUP_SCHEDULER_FULL_RESTORE_DRILL_AT:-04:45}
      BACKUP_SCHEDULER_RESTORE_DRILL_WEEKDAY: ${BACKUP_SCHEDULER_RESTORE_DRILL_WEEKDAY:-0}
      BACKUP_SCHEDULER_RETENTION_CRON: "${BACKUP_SCHEDULER_RETENTION_CRON:-50 */8 * * *}"
      BACKUP_SCHEDULER_ENABLE_RETENTION_APPLY: ${BACKUP_SCHEDULER_ENABLE_RETENTION_APPLY:-false}
      BACKUP_SCHEDULER_ENABLE_OFFSITE: ${BACKUP_SCHEDULER_ENABLE_OFFSITE:-false}
      BACKUP_SCHEDULER_OFFSITE_CRON: "${BACKUP_SCHEDULER_OFFSITE_CRON:-35 */8 * * *}"
      BACKUP_SIGNING_KEYS_FILE: /infra/secrets/backup_signing_keys.txt
      RESTIC_IMAGE: ${RESTIC_IMAGE:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-/infra/secrets/restic_password.txt}
      RESTIC_KEEP_LAST: ${RESTIC_KEEP_LAST:-42}
      RESTIC_HOSTNAME: ${RESTIC_HOSTNAME:-platform-infrastructure}
      RESTIC_REQUIRE_IMMUTABLE_IMAGE: ${RESTIC_REQUIRE_IMMUTABLE_IMAGE:-true}
      RESTIC_MAX_REPOSITORY_BYTES: ${RESTIC_MAX_REPOSITORY_BYTES:-2500000000000}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/infra/secrets/rclone/rclone.conf}
      POSTGRES_BACKUP_DATABASE: ${POSTGRES_BACKUP_DATABASE:-app_db}
      APP_DB_NAME: ${APP_DB_NAME:-app_db}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_OPS_SCHEMA: ${POSTGRES_OPS_SCHEMA:-}
      BACKUP_LOCAL_KEEP_LAST: ${BACKUP_LOCAL_KEEP_LAST:-42}
      BACKUP_SCHEDULER_JOBS_DIR: /var/www/project-state/backup-jobs
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/infra
      - ./projects-portal/state:/var/www/project-state
      - ${PROJECT_SOURCE_DIR:-../src}:/project:ro
      - backup_scheduler_logs:/var/log/platform
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker-jobs:
        condition: service_healthy
      worker-notifications:
        condition: service_healthy
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/crontabs/root && pgrep crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  backup_scheduler_logs:
    name: ${BACKUP_SCHEDULER_LOG_VOLUME:-platform_backup_scheduler_logs}
